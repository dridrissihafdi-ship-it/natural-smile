<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Natural Smile</title>
<meta name="description" content="Application interne de Natural Smile Dental Office et de son laboratoire.">
<meta name="theme-color" content="#fffdf9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1a18" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Natural Smile">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Great+Vibes&family=Figtree:wght@400;500;600;700&display=swap">
<style>
html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: "lit marble" — quiet stone surfaces; the only bold element is brushed-gold tiles (from the logo) and one backlit charcoal panel (from the signboard). Phone: floating tab bar; desktop: sidebar + 880px column. */
:root{
  --bg:#f1eee8; --surface:#fffdf9; --surface-2:#f2ede4; --line:#e6dfd2;
  --fg:#2e2d2b; --muted:#78726a; --accent:#8a6f42; --accent-fg:#ffffff; --accent-soft:#f4ede0;
  --gold-1:#dccaa3; --gold-2:#b79c6b; --gold-3:#8c7346; --charcoal:#4b4b4b;
  --panel:#2c2b29; --panel-fg:#f6efe2; --panel-gold:#f0d9a6; --glow:rgba(0,0,0,0);
  --shadow:0 1px 2px rgba(70,55,30,.05),0 10px 30px -18px rgba(70,55,30,.35);
  --ok:#2f7a4a; --ok-soft:#e1efe5; --warn:#94600c; --warn-soft:#f6ebd3; --bad:#a93a2f; --bad-soft:#f6e1dd; --badge:#b4562f;
  --bubble-me:#8a6f42; --bubble-me-fg:#ffffff;
  --f-display:"Poppins","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-script:"Great Vibes","Snell Roundhand","Apple Chancery",cursive;
  --r-lg:20px; --r:14px; --r-sm:10px; --navh:66px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121110; --surface:#1b1a18; --surface-2:#24221f; --line:#322e29;
  --fg:#efe9df; --muted:#a69f94; --accent:#d4b77f; --accent-fg:#1c1509; --accent-soft:#2c2518;
  --gold-1:#cdb37e; --gold-2:#a88b57; --gold-3:#7b6337; --charcoal:#ddd6cb;
  --panel:#1f1d1a; --panel-fg:#f3ebdc; --panel-gold:#f2d9a0; --glow:rgba(230,188,105,.32);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -18px rgba(0,0,0,.7);
  --ok:#62c283; --ok-soft:#173222; --warn:#e3a944; --warn-soft:#33270f; --bad:#ef7d70; --bad-soft:#3a1b17; --badge:#d9774a;
  --bubble-me:#4a3d25; --bubble-me-fg:#f5ecda; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#121110; --surface:#1b1a18; --surface-2:#24221f; --line:#322e29;
  --fg:#efe9df; --muted:#a69f94; --accent:#d4b77f; --accent-fg:#1c1509; --accent-soft:#2c2518;
  --gold-1:#cdb37e; --gold-2:#a88b57; --gold-3:#7b6337; --charcoal:#ddd6cb;
  --panel:#1f1d1a; --panel-fg:#f3ebdc; --panel-gold:#f2d9a0; --glow:rgba(230,188,105,.32);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -18px rgba(0,0,0,.7);
  --ok:#62c283; --ok-soft:#173222; --warn:#e3a944; --warn-soft:#33270f; --bad:#ef7d70; --bad-soft:#3a1b17; --badge:#d9774a;
  --bubble-me:#4a3d25; --bubble-me-fg:#f5ecda; color-scheme:dark }
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0;line-height:1.2;letter-spacing:-.01em}
h1{font-size:1.7rem}h2{font-size:1.2rem}h3{font-size:1.02rem}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.muted{color:var(--muted)}.small{font-size:.86rem}
.eyebrow{font-size:.88rem;color:var(--muted);font-weight:500}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gold{background:linear-gradient(145deg,var(--gold-1) 0%,var(--gold-2) 52%,var(--gold-3) 100%);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 22px var(--glow)}

/* shell */
.app{display:grid;grid-template-columns:1fr;min-height:100%}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{width:42px;height:42px;flex:none;display:block;filter:drop-shadow(0 0 10px var(--glow))}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:.92rem;line-height:1.15;letter-spacing:.09em;color:var(--charcoal);text-transform:uppercase}
.brand-sub{font-family:var(--f-script);font-size:1.15rem;line-height:1.1;color:var(--muted)}
.brand-sub,.brand-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.me-chip{display:flex;align-items:center;gap:8px;font-size:.86rem;color:var(--muted);min-width:0}
.me-chip img{width:32px;height:32px;border-radius:50%;box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--gold-2)}
.me-chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:22ch}
@media (max-width:520px){.brand-name .long{display:none}.me-chip span{display:none}}
.side{display:none}
.app.gated{grid-template-columns:1fr!important}.app.gated .side{display:none!important}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:22px calc(var(--navh) + 44px + env(safe-area-inset-bottom,0px));width:100%;max-width:900px;margin:0 auto;min-width:0}
.tabbar{position:fixed;z-index:6;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));
  height:var(--navh);background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);
  display:grid;grid-template-columns:repeat(5,1fr);padding-inline:4px}
.tab{background:none;border:0;padding:6px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.7rem;color:var(--muted);cursor:pointer;position:relative;border-radius:18px}
.tab svg{width:34px;height:30px;padding:4px 7px;border-radius:10px;transition:background .2s,color .2s}
.tab[aria-current="page"]{color:var(--fg);font-weight:600}
.tab[aria-current="page"] svg{background:linear-gradient(145deg,var(--gold-1),var(--gold-2) 55%,var(--gold-3));color:#fff;box-shadow:0 0 16px var(--glow)}
.badge{position:absolute;top:3px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--badge);color:#fff;font-size:.68rem;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px var(--surface)}
@media (min-width:960px){
  :root{--navh:0px}
  .app{grid-template-columns:248px 1fr}
  .top{grid-column:1/-1;padding-block:12px}
  .side{display:flex;flex-direction:column;gap:2px;padding:20px 12px;border-right:1px solid var(--line);background:var(--surface);
    position:sticky;top:calc(env(safe-area-inset-top,0px) + 67px);height:calc(100vh - 67px);overflow:auto;padding-left:max(12px,env(safe-area-inset-left,0px))}
  .tabbar{display:none}
  main{padding-block:32px 48px}
}
.nav-item{display:flex;align-items:center;gap:12px;padding:7px 10px;border-radius:12px;border:0;background:none;cursor:pointer;color:var(--fg);text-align:left;position:relative;font-weight:500;width:100%}
.nav-item svg{width:32px;height:32px;padding:6px;border-radius:9px;color:var(--muted);background:var(--surface-2);flex:none}
.nav-item:hover{background:var(--surface-2)}
.nav-item[aria-current="page"]{background:var(--accent-soft);font-weight:600}
.nav-item[aria-current="page"] svg{background:linear-gradient(145deg,var(--gold-1),var(--gold-2) 55%,var(--gold-3));color:#fff;box-shadow:0 0 14px var(--glow)}
.nav-item .badge{position:static;margin-left:auto;box-shadow:none}

/* components */
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row .sp{flex:1}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow);min-width:0}
.card.flat{background:var(--surface-2);border-color:transparent;box-shadow:none}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.card-h .sp{flex:1}
.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head .sp{flex:1}
.btn{border:1px solid transparent;border-radius:12px;padding:9px 15px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface-2);color:var(--fg);white-space:nowrap;transition:filter .15s,background .15s}
.btn:hover{filter:brightness(.97)}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn.big{padding:13px 20px;font-size:1rem;border-radius:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.ib{border:0;background:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
.ib:hover{background:var(--surface-2);color:var(--fg)}
.ib svg{width:20px;height:20px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.76rem;font-weight:600;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.acc{background:var(--accent-soft);color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.86rem;cursor:pointer;font-weight:500}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
label.f{position:relative;display:flex;flex-direction:column;gap:6px;font-size:.84rem;font-weight:600;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 13px;font-size:16px;color:var(--fg);min-width:0;transition:border-color .15s,box-shadow .15s}
.inp:focus{outline:none;border-color:var(--gold-2);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{resize:vertical;min-height:90px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600}
.li .s{font-size:.84rem;color:var(--muted);overflow-wrap:anywhere}
.empty{text-align:center;padding:30px 12px;color:var(--muted)}
.empty strong{display:block;color:var(--fg);font-family:var(--f-display);font-weight:600;font-size:1.02rem;margin-bottom:4px}
.banner{border-radius:var(--r);padding:12px 14px;background:var(--warn-soft);color:var(--warn);font-size:.92rem}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th{text-align:left;font-size:.8rem;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--f-display);font-weight:600;font-size:1.75rem;line-height:1.1}
.progress{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-1),var(--gold-3));border-radius:4px;transition:width .25s}
.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(var(--navh) + 24px + env(safe-area-inset-bottom,0px));z-index:4;border-radius:18px;box-shadow:0 10px 26px -8px rgba(60,45,20,.5)}

/* home */
.greet{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.greet h1{font-size:1.9rem}
.lit,.clock{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:22px;color:var(--panel-fg);
  background:radial-gradient(110% 120% at 85% -30%,rgba(232,196,120,.42),transparent 58%),radial-gradient(80% 90% at 0% 120%,rgba(232,196,120,.14),transparent 60%),var(--panel);
  display:grid;gap:14px;grid-template-columns:1fr;box-shadow:var(--shadow)}
.lit::after,.clock::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(240,217,166,.18);pointer-events:none}
.lit-time,.clock .bigtime{font-family:var(--f-display);font-weight:600;font-size:3.1rem;line-height:1;letter-spacing:-.02em;color:var(--panel-gold);text-shadow:0 0 28px rgba(240,200,120,.35)}
.lit-st,.clock .st{font-size:.95rem;opacity:.85;max-width:46ch}
.lit .btn,.clock .btn{justify-self:start;background:linear-gradient(145deg,#ecd9ad,#c6a96f);color:#2a2111;border:0;box-shadow:0 6px 20px -6px rgba(230,190,110,.6)}
.lit-label{font-size:.88rem;color:var(--panel-gold);opacity:.85}
@media(min-width:640px){.lit{grid-template-columns:auto 1fr auto;align-items:center;gap:24px}.lit .btn{justify-self:end}}
.tiles{display:grid;grid-template-columns:repeat(var(--cols,4),1fr);gap:14px 8px}
@media(min-width:640px){.tiles{grid-template-columns:repeat(var(--colsd,8),1fr)}}
.mtile{border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:.8rem;font-weight:500;color:var(--fg);position:relative;padding:0}
.mtile .gold{width:58px;height:58px;border-radius:17px;display:grid;place-items:center;transition:transform .15s}
.mtile .gold svg{width:28px;height:28px}
.mtile:hover .gold{transform:translateY(-2px)}
.mtile .badge{top:-4px;left:calc(50% + 16px)}
.mini-kpis{display:flex;gap:22px;flex-wrap:wrap;padding-block:6px 4px}
.timechip{font-family:var(--f-display);font-weight:600;font-size:.92rem;min-width:46px}

/* agenda */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:7px 2px;text-align:center;cursor:pointer;font-size:.74rem;color:var(--muted)}
.day b{display:block;font-family:var(--f-display);font-weight:600;font-size:1.05rem;color:var(--fg)}
.day[aria-pressed="true"]{background:linear-gradient(145deg,var(--gold-1),var(--gold-2) 55%,var(--gold-3));border-color:transparent;color:#fff;box-shadow:0 0 16px var(--glow)}
.day[aria-pressed="true"] b{color:#fff}
.day.today:not([aria-pressed="true"]) b{color:var(--accent)}
.rdv{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:13px 4px;border-bottom:1px solid var(--line)}
.rdv:last-child{border-bottom:0}
.rdv .h{font-family:var(--f-display);font-weight:600;font-size:1rem}
.rdv .h small{display:block;color:var(--muted);font-size:.74rem;font-family:var(--f-body);font-weight:400}
.rdv .grow{min-width:0;cursor:pointer}
.rdv{border-left:4px solid var(--tc,transparent);padding-left:10px!important}
.stag{display:inline-block;font-size:.7rem;font-weight:600;padding:1px 8px;border-radius:9px;color:#fff;background:var(--tc);vertical-align:2px;margin-left:4px}
.legend{display:flex;gap:6px 12px;overflow-x:auto;scrollbar-width:none;padding:2px 0;font-size:.74rem;color:var(--muted);white-space:nowrap}.legend::-webkit-scrollbar{display:none}
.legend .lg{display:inline-flex;align-items:center;gap:5px}.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.rdv{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;transition:background .2s}.rdv.pressing{background:var(--accent-soft);border-radius:12px}
.alprog{display:flex;flex-direction:column;gap:6px;margin:8px 0 2px}.alprog .bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden}.alprog .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-1),var(--gold-2))}
.hrow{display:flex;flex-direction:column;gap:4px}.hrow input[type=time]{width:auto;min-width:96px;padding:8px}
.cthumbs{display:flex;gap:6px;flex-wrap:wrap}.cthumb{position:relative;display:inline-block}.cthumb img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.cthumb .pdfchip{display:grid;place-items:center;width:64px;height:64px;border-radius:10px;background:var(--accent-soft);font-weight:700;color:var(--gold-2);text-decoration:none}
.cthumb .x{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-weight:700;cursor:pointer;line-height:1}
.paycard{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.demo-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:2px solid var(--gold-2)}.demo-bar>svg{width:22px;height:22px}
.pv{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center;touch-action:none;overflow:hidden}
.pv img{max-width:100%;max-height:100%;transform-origin:0 0;will-change:transform;user-select:none;-webkit-user-drag:none}
.pv .pvx{position:absolute;top:calc(12px + env(safe-area-inset-top));right:14px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:24px;cursor:pointer;z-index:2}
.pv .pvh{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:rgba(255,255,255,.7);font-size:.8rem}
html{touch-action:manipulation}
.odonto{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}.oq{display:flex;gap:3px;justify-content:flex-end}.oq:nth-child(2n){justify-content:flex-start}.oq:nth-child(-n+2){padding-bottom:6px;border-bottom:2px solid var(--line)}
.tooth{flex:1;max-width:38px;min-width:0;aspect-ratio:3/4;border:1.5px solid var(--line);border-radius:8px 8px 12px 12px;background:var(--surface);font:600 .72rem var(--f-body);color:var(--fg);cursor:pointer;padding:0}
.tooth.abs{opacity:.55;text-decoration:line-through}.tooth.plan{outline:2px dashed var(--gold-2);outline-offset:1px}

/* ---------- horaires de travail ---------- */
const JOURS=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const DEF_HORAIRES={tol:10,jours:{'0':[],'1':[['08:30','16:00']],'2':[['08:30','13:30'],['14:30','19:00']],'3':[['08:30','13:30'],['14:30','19:00']],'4':[['08:30','16:00']],'5':[['08:30','13:30'],['14:30','19:00']],'6':[['08:30','13:00']]}};
const horaires=()=>{const h=S.cfg?.horaires;return h?.jours?h:DEF_HORAIRES};
const slotsOf=date=>{const j=horaires().jours[String(new Date(date+'T12:00:00').getDay())];return Array.isArray(j)?j.filter(x=>x&&x[0]&&x[1]):[]};
const toMin=t=>{const[a,b]=String(t).split(':').map(Number);return a*60+(b||0)};
const minOf=ts=>{const d=new Date(ts);return d.getHours()*60+d.getMinutes()};
const slotsTxt=sl=>sl.length?sl.map(x=>x[0]+'–'+x[1]).join(' · '):'Repos';
const prevuMs=date=>slotsOf(date).reduce((t,x)=>t+(toMin(x[1])-toMin(x[0]))*60000,0);
function ptEcarts(date,p){const sl=slotsOf(date),st=ptState(p),tol=Number(horaires().tol)||0,o={retard:0,avance:0};if(!sl.length||!st.first)return o;
 const r=minOf(st.first)-toMin(sl[0][0]);if(r>tol)o.retard=r;
 if(st.last?.out&&!st.inside){const a=toMin(sl[sl.length-1][1])-minOf(st.last.out);if(a>tol)o.avance=a}return o}
const ecartPills=(date,p)=>{const e=ptEcarts(date,p);return (e.retard?` <span class="pill bad">retard ${e.retard} min</span>`:'')+(e.avance?` <span class="pill warn">départ anticipé ${e.avance} min</span>`:'')};
function horairesEdit(){if(!S.isOwner)return;const H=horaires();const row=k=>{const sl=H.jours[k]||[];const v=(i,j)=>esc(sl[i]?.[j]||'');
  return `<div class="hrow"><b>${JOURS[k]}</b><div class="row" style="gap:6px;flex-wrap:wrap"><input class="inp" type="time" name="a${k}" value="${v(0,0)}"><span>→</span><input class="inp" type="time" name="b${k}" value="${v(0,1)}"><span class="small muted">puis</span><input class="inp" type="time" name="c${k}" value="${v(1,0)}"><span>→</span><input class="inp" type="time" name="d${k}" value="${v(1,1)}"></div></div>`};
 openModal({title:'Horaires de travail',body:`<div class="small muted">Laissez vide pour un jour de repos. Pour un horaire continu, remplissez seulement la première plage.</div>
  <div class="stack" style="gap:10px">${[1,2,3,4,5,6,0].map(row).join('')}</div>
  <label class="f" style="max-width:220px">Tolérance de retard (minutes)<input class="inp" type="number" min="0" max="60" name="tol" value="${esc(H.tol??10)}"></label>`,
 onOk:f=>{const jours={};for(let k=0;k<7;k++){const sl=[];if(f['a'+k]&&f['b'+k])sl.push([f['a'+k],f['b'+k]]);if(f['c'+k]&&f['d'+k])sl.push([f['c'+k],f['d'+k]]);
   for(const x of sl)if(toMin(x[1])<=toMin(x[0])){toast(JOURS[k]+' : l\'heure de fin doit suivre l\'heure de début.','err');return false}jours[k]=sl}
  return W(()=>S.db.doc('cfg/horaires').set({jours,tol:Math.max(0,Number(f.tol)||0),maj:Date.now()}),'Horaires enregistrés')}})}
/* ---------- pointage helpers ---------- */
function ptState(p){const s=p?.sessions||[];const last=s[s.length-1];return {sessions:s,inside:!!(last&&!last.out),first:s[0]?.in,last,
 total:s.reduce((t,x)=>t+((x.out||Date.now())-x.in),0)}}
function getPos(){return new Promise((res,rej)=>{if(!navigator.geolocation){rej(new Error('nogeo'));return}navigator.geolocation.getCurrentPosition(p=>res(p.coords),e=>rej(e),{enableHighAccuracy:true,timeout:20000,maximumAge:0})})}
function distM(a,b){const R=6371000,r=x=>x*Math.PI/180;const dl=r(b.lat-a.lat),dg=r(b.lng-a.lng);const h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const geoErr=e=>e?.code===1?'Localisation refusée. Autorisez la position pour cette application dans les réglages du téléphone (Confidentialité > Service de localisation).':e?.code===3?'Position introuvable (délai dépassé). Réessayez près d\'une fenêtre ou activez le Wi-Fi.':'Position indisponible sur cet appareil.';
async function pointer(){
 if(!S.uid){toast('Votre identité n\'est pas disponible : ouvrez la page connecté à votre compte.','err');return}
 const cab=S.cfg.cabinet;let loc=null;
 if(cab?.lat!=null&&!S.isOwner){toast('Vérification de votre position…');let c;try{c=await getPos()}catch(e){toast(geoErr(e),'err');return}
  const d=Math.round(distM(cab,{lat:c.latitude,lng:c.longitude})),acc=Math.round(c.accuracy||0),R=Number(cab.rayon)||10;
  const v=siteVerdict(d,acc,R,S.site==='in');presLog(v===null?'imprecis':v?'in':'out',d,acc);
  if(v===null&&S.site!=='in'){toast('Position trop imprécise : activez le Wi-Fi et la « Position exacte », puis réessayez.','err');return}
  if(v===false){toast('Pointage indisponible pour le moment.','err');return}
  loc={d,acc}}
 {const sl=slotsOf(today()),n=minOf(Date.now());const ok=sl.length&&n>=toMin(sl[0][0])-60&&n<=toMin(sl[sl.length-1][1])+60;
  if(!ok&&!await ask(sl.length?`Vous êtes en dehors des horaires du jour (${slotsTxt(sl)}). Pointer quand même ?`:'Aujourd\'hui est un jour de repos. Pointer quand même ?','Pointer'))return;if(!ok)loc={...(loc||{}),hors:true}}
 const st=ptState(S.myPointage);const sess=st.sessions.map(x=>({...x}));let msg;
 if(st.inside){const l=sess[sess.length-1];l.out=Date.now();if(loc)l.outLoc=loc;msg='Départ enregistré à '+nowHM()}else{sess.push({in:Date.now(),out:null,...(loc?{inLoc:loc}:{})});msg='Arrivée enregistrée à '+nowHM()}
 await W(()=>S.db.doc(`pointage/${S.uid}/j/${today()}`).set({date:today(),mois:today().slice(0,7),sessions:sess}),msg);
}

const SITE_TOL=60,SITE_MAXACC=150;
/* Décide à partir d'une mesure GPS : true = au cabinet, false = dehors, null = mesure trop imprécise pour conclure */
function siteVerdict(d,acc,R,wasIn){if(acc>SITE_MAXACC)return d-SITE_MAXACC>R+200?false:null;const eff=d-Math.max(20,Math.min(acc,SITE_TOL));return eff<=R+(wasIn?25:0)}
function presLog(st,d,acc){try{if(S.demo||S._owner||!S.uid||!S.db)return;const k=st+'|'+Math.round(d/10);const now=Date.now();if(S._presK===k&&now-(S._presT||0)<600000)return;S._presK=k;S._presT=now;
 S.db.doc('presence/'+S.uid).set({st,d:Math.round(d),acc:Math.round(acc),t:now}).catch(()=>{})}catch(e){}}

function demoStart(u){if(!S._owner)return;S.demo=u;S.demoSite='in';$('#dlg')?.open&&$('#dlg').close();restartData();renderNav();go('accueil');toast('Démo : '+nameOf(u))}
function demoExit(){S.demo=null;restartData();renderNav();go('equipe')}
function siteBanner(){return `<div class="banner warn site-lock">${ic('lock')}<div style="flex:1"><b>Les fonctionnalités de l'application sont temporairement désactivées.</b></div>${S.site&&S.site!=='checking'&&S.site!=='in'?`<button class="btn ghost" data-act="siteRetry">Réessayer</button>`:''}</div>`}
function applyLock(){if(S.dataStarted)restartData();renderNav();if(!allowedView(S.view))go('accueil');else{const m=$('#main');if(m&&Views[S.view]){m.innerHTML='';Views[S.view].mount?.(m);Views[S.view].update?.(m)}}}
function setSite(st,info){const before=siteLock();S.site=st;S.siteInfo=info||{};if(st==='in')ls.set('ns_site_in',Date.now());
 const after=siteLock();S.lockPrev=after;if(before!==after)applyLock();else if(S.view==='accueil'||!after)refresh()}
setInterval(()=>{if(!S.dataStarted)return;const l=siteLock();if(S.lockPrev!==undefined&&l!==S.lockPrev)applyLock();S.lockPrev=l},30000);
function sitePos(p){const c=p.coords||p;const cab=S.cfg?.cabinet;if(!cab||cab.lat==null)return;const d=distM(cab,{lat:c.latitude,lng:c.longitude}),acc=c.accuracy||0,R=Number(cab.rayon)||10;
 const wasIn=S.site==='in';const v=siteVerdict(d,acc,R,wasIn);presLog(v===null?'imprecis':v?'in':'out',d,acc);
 if(v===true){S._outN=0;setSite('in',{d,acc});return}
 if(v===null){if(!wasIn){S._impN=(S._impN||0)+1;if(S._impN>=3)setSite('out',{d,acc})}return}
 // dehors : on exige deux mesures concordantes à au moins 45 s d'intervalle avant de verrouiller quelqu'un qui était au cabinet
 if(wasIn){const now=Date.now();if(!S._outN||now-(S._outT||0)>600000){S._outN=1;S._outT=now;return}if(now-S._outT<45000)return;S._outN=0}
 setSite('out',{d,acc})}
let siteWatch=null;
function startSite(){if(S._owner||!S.cfg?.cabinet||S.cfg.cabinet.lat==null)return;
 if(!S.site){const last=Number(ls.get('ns_site_in',0));S.site=Date.now()-last<20*60000?'in':'checking'}
 if(!navigator.geolocation){setSite('nogps',{msg:'Cet appareil ne permet pas de vérifier votre position (pas de GPS).'});return}
 const err=e=>{if(S.site==='in'&&Date.now()-Number(ls.get('ns_site_in',0))<20*60000&&e?.code!==1)return;presLog('erreur'+(e?.code||''),0,0);setSite('nogps',{msg:geoErr(e)})};
 navigator.geolocation.getCurrentPosition(sitePos,err,{enableHighAccuracy:true,timeout:20000,maximumAge:15000});

async function patCandidates(raw){const q=norm(raw);if(!q||!S.db)return[];const P=S.db.collection('patients');const digits=q.replace(/[\s.\-+]/g,'');
 const qs=[P.where('cle','>=',q).where('cle','<=',q+'\uf8ff').limit(10).get(),P.where('cle2','>=',q).where('cle2','<=',q+'\uf8ff').limit(10).get()];
 if(/^\d{3,}$/.test(digits))qs.push(P.where('telN','>=',digits).where('telN','<=',digits+'\uf8ff').limit(10).get());
 const snaps=await Promise.all(qs);const seen=new Set(),res=[];snaps.forEach(s=>s.docs.forEach(d=>{if(!seen.has(d.id)){seen.add(d.id);res.push({id:d.id,...d.data()})}}));
 return res.sort((a,b)=>patName(a).localeCompare(patName(b),'fr')).slice(0,12)}
function patSuggest(inp,onPick){if(!inp)return;S.patPick=S.patPick||{};const box=document.createElement('div');box.className='sugg';box.hidden=true;box.setAttribute('role','listbox');inp.after(box);

 const close=()=>{box.hidden=true;sel=-1};
 const pick=p=>{const label=patName(p)+(p.tel?' ('+p.tel+')':'');S.patPick[label]={id:p.id,nom:patName(p),tel:p.tel||''};inp.value=label;close();onPick&&onPick(p);inp.dispatchEvent(new Event('change'))};
 const draw=()=>{box.innerHTML=items.length?items.map((p,i)=>`<button type="button" data-i="${i}" class="${i===sel?'on':''}"><span class="avatar">${esc(initials(p))}</span><span style="min-width:0"><div class="t">${esc(patName(p))}</div><div class="s">${esc([ageOf(p.naissance),p.tel].filter(Boolean).join(', ')||'Aucune coordonnée')}</div></span></button>`).join('')
  :'<div class="none">Aucun patient trouvé — une nouvelle fiche sera proposée.</div>';box.hidden=false};
 const run=async()=>{const v=inp.value.trim();if(!v||S.patPick[v]){close();return}const t=++tok;let r=[];try{r=await patCandidates(v)}catch(e){console.warn(e);return}
  if(t!==tok||inp.value.trim()!==v||document.activeElement!==inp)return;items=r;sel=-1;draw()};
 inp.addEventListener('input',()=>later('sugg'+inp.id,run,180));inp.addEventListener('focus',()=>{if(inp.value.trim()&&!S.patPick[inp.value.trim()])run()});

 box.addEventListener('pointerdown',e=>e.preventDefault());

const IMP_FIELDS=[['nom','Nom'],['prenom','Prénom'],['complet','Nom complet (nom + prénom)'],['tel','Téléphone'],['tel2','Téléphone 2'],['naissance','Date de naissance'],['sexe','Sexe'],['cin','CIN'],['adresse','Adresse'],['couv','Couverture / mutuelle'],['allergies','Allergies'],['antecedents','Antécédents'],['traitements','Traitements'],['notes','Notes / observations'],['dossier','N° de dossier']];

function loadScriptOnce(src){return new Promise((res,rej)=>{if(document.querySelector(`script[data-src="${src}"]`)){res();return}const sc=document.createElement('script');sc.src=src;sc.dataset.src=src;sc.onload=res;sc.onerror=()=>rej(new Error('load'));document.head.appendChild(sc)})}
function impDate(v){if(v==null||v==='')return '';if(v instanceof Date&&!isNaN(v))return dstr(v);if(typeof v==='number'&&v>1000&&v<80000){const d=new Date(Math.round((v-25569)*864e5));return d.toISOString().slice(0,10)}
 const t=String(v).trim();let m=t.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/);if(m){let y=+m[3];if(y<100)y+=y>30?1900:2000;return `${y}-${pad(+m[2])}-${pad(+m[1])}`}
 m=t.match(/^(\d{4})[\/.\-](\d{1,2})[\/.\-](\d{1,2})/);if(m)return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;m=t.match(/^(\d{1,3})\s*ans?$/i);if(m){return `${new Date().getFullYear()-(+m[1])}-01-01`}return ''}

// Lit un code EAN/UPC ou GS1 (DataMatrix, GS1-128) : renvoie la clé (GTIN sur 14 chiffres si possible), le lot et la péremption.
function parseCode(raw){let s=String(raw||'').trim().replace(/^\][A-Za-z]\d/,'');const out={raw:s,key:'',lot:'',exp:''};if(!s)return out;
 const GS='\x1d';
 if(/^\(\d{2,4}\)/.test(s)){const re=/\((\d{2,4})\)([^(]*)/g;let m;while((m=re.exec(s))){const ai=m[1],v=m[2].trim();if(ai==='01'||ai==='02')out.gtin=v;else if(ai==='10')out.lot=v;else if(ai==='17')out.exp=v}}
 else if(/^(01|02)\d{14}/.test(s)){const FIX={'00':18,'01':14,'02':14,'11':6,'12':6,'13':6,'15':6,'16':6,'17':6,'20':2};let i=0,guard=0;
  while(i<s.length&&guard++<20){if(s[i]===GS){i++;continue}const ai2=s.substr(i,2);
   if(FIX[ai2]){const v=s.substr(i+2,FIX[ai2]);if(ai2==='01'||ai2==='02')out.gtin=v;if(ai2==='17')out.exp=v;i+=2+FIX[ai2];continue}
   let ai=ai2;if(/^(24|25|71|72|80|81|82)/.test(ai2))ai=s.substr(i,3);if(/^(70|73|74)/.test(ai2))ai=s.substr(i,4);
   let j=s.indexOf(GS,i+ai.length);if(j<0)j=s.length;const v=s.slice(i+ai.length,j);if(ai==='10')out.lot=v;i=j}}
 if(out.exp&&/^\d{6}$/.test(out.exp)){const y=2000+ +out.exp.slice(0,2),mo=out.exp.slice(2,4),d=out.exp.slice(4,6);out.exp=`${y}-${mo}-${d==='00'?'28':d}`}else out.exp='';
 const g=out.gtin||(/^\d{8,14}$/.test(s)?s:'');out.key=g?g.padStart(14,'0'):s.replace(/\s+/g,'').toUpperCase();return out}
const itemByCode=key=>zoneItems().find(i=>(i.codes||[]).includes(key));
let beepCtx=null;function beep(ok){try{beepCtx=beepCtx||new (window.AudioContext||window.webkitAudioContext)();const o=beepCtx.createOscillator(),g=beepCtx.createGain();o.frequency.value=ok?1250:330;g.gain.value=.08;o.connect(g);g.connect(beepCtx.destination);o.start();o.stop(beepCtx.currentTime+(ok?.09:.25))}catch(e){}try{navigator.vibrate?.(ok?60:[80,60,80])}catch(e){}}

async function encryptFor(pubJwk,obj){const pub=await crypto.subtle.importKey('jwk',pubJwk,{name:'RSA-OAEP',hash:'SHA-256'},false,['encrypt']);
 const k=await crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt']);const iv=crypto.getRandomValues(new Uint8Array(12));
 const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(JSON.stringify(obj)));const raw=await crypto.subtle.exportKey('raw',k);
 const wk=await crypto.subtle.encrypt({name:'RSA-OAEP'},pub,raw);return {v:1,iv:b64(iv),ct:b64(ct),k:b64(wk)}}
async function privKey(){if(S.privKey)return S.privKey;const s=await S.db.doc(`data/users/${S.uid}/cles`).get();if(!s.exists)throw new Error('nokey');
 S.privKey=await crypto.subtle.importKey('jwk',s.data().priv,{name:'RSA-OAEP',hash:'SHA-256'},false,['decrypt']);return S.privKey}
async function decryptEnt(enc){const pk=await privKey();const raw=await crypto.subtle.decrypt({name:'RSA-OAEP'},pk,unb64(enc.k));
 const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(enc.iv)},k,unb64(enc.ct));return JSON.parse(new TextDecoder().decode(pt))}

 try{const kp=await crypto.subtle.generateKey({name:'RSA-OAEP',modulusLength:2048,publicExponent:new Uint8Array([1,0,1]),hash:'SHA-256'},true,['encrypt','decrypt']);
  const pub=await crypto.subtle.exportKey('jwk',kp.publicKey),priv=await crypto.subtle.exportKey('jwk',kp.privateKey);
  if(!await W(()=>S.db.doc(`data/users/${S.uid}/cles`).set({priv,cree:Date.now()})))return;
  await W(()=>S.db.doc('cfg/caisse').set({pub,active:Date.now()}),'Caisse activée')}catch(e){console.warn(e);toast('Activation impossible sur cet appareil.','err')}}

async function decRec(id,u,x){const key=u+'/'+id+'/'+(x.modifie?.ts||0);if(REC_CACHE.has(key))return REC_CACHE.get(key);
 const o={id,uid:u,ts:x.ts,date:x.date,patientId:x.patientId||null,...(await decryptEnt(x.enc))};if(x.modifie){o.modifie=x.modifie;try{if(x.encAvant)o.avant=(await decryptEnt(x.encAvant)).montant}catch(e){}}REC_CACHE.set(key,o);return o}

const FACT_CATS=['Consommables','Matériel','Laboratoire (sous-traitance)','Implants et biomatériaux','Orthodontie et aligneurs','Loyer','Électricité et eau','Téléphone et Internet','Entretien et réparations','Logiciels et abonnements','Salaires et charges sociales','Impôts et taxes','Autre'];
const PAY_MODES={especes:'Espèces',cheque:'Chèque',virement:'Virement',carte:'Carte bancaire',effet:'Effet / traite'};
const ASSUREURS=['CNOPS','CNSS (AMO)','AXA Assurance','Sanlam (ex-Saham)','Wafa Assurance','RMA','AtlantaSanad','MAMDA / MCMA','Allianz','Mutuelle FAR','Mutuelle de l\'enseignement (MGPAP)','Autre'];
const ASS_STATUTS={rempli:'Feuille remplie',remis:'Remise au patient',rembourse:'Remboursée'};
const fourList=()=>Object.values(S.four||{}).sort((a,b)=>(a.nom||'').localeCompare(b.nom||'','fr'));
const fourName=id=>S.four?.[id]?.nom||'';
const factPaye=f=>(f.paiements||[]).reduce((t,p)=>t+(Number(p.montant)||0),0);
const factReste=f=>Math.max(0,(Number(f.montant)||0)-factPaye(f));
const telLink=t=>String(t||'').replace(/[^\d+]/g,'');
const waLink=(t,txt)=>{let d=String(t||'').replace(/\D/g,'');if(d.startsWith('0'))d='212'+d.slice(1);return d?`https://wa.me/${d}${txt?'?text='+encodeURIComponent(txt):''}`:''};
function pickFiles(accept,multiple){return new Promise(res=>{const i=document.createElement('input');i.type='file';i.accept=accept||'image/*,application/pdf';i.multiple=!!multiple;i.hidden=true;
 i.onchange=()=>{res([...i.files]);i.remove()};document.body.appendChild(i);i.click()})}
async function uploadFiles(files){const out=[];let n=0;for(const f of files){n++;toast(`Envoi ${n} sur ${files.length}…`);
 try{if(f.type==='application/pdf'){const up=await S.assets.upload(f,{type:'application/pdf'});out.push({url:up.id,pdf:true})}else{const b=await compressImg(f,2200,.86);const up=await S.assets.upload(b,{type:'image/jpeg'});out.push({url:up.id})}}catch(e){console.warn(e);toast(errMsg(e),'err')}}return out}
const thumbsHTML=(L,k)=>(L||[]).map((x,i)=>`<span class="cthumb">${x.pdf?`<a href="${esc(x.url)}" target="_blank" rel="noopener" class="pdfchip">PDF</a>`:`<img src="${esc(x.url)}" alt="Pièce jointe" data-act="zoom" style="cursor:zoom-in">`}${k?`<button type="button" class="x" data-rm="${k}" data-i="${i}" aria-label="Retirer">×</button>`:''}</span>`).join('');

Views.compta={
 mount(el){const t=S.cTab||'factures';const can=perm('compta_edit');
  el.innerHTML=`<div class="stack"><div class="head"><div><div class="eyebrow">Comptabilité</div><h1>${{factures:'Factures et paiements',assurances:'Assurances des patients',fournisseurs:'Fournisseurs et laboratoires'}[t]}</h1></div></div>${banners()}
  <div class="segtabs" role="tablist">${[['factures','cash','Factures'],['assurances','shield','Assurances'],['fournisseurs','truck','Fournisseurs']].map(([k,i,l])=>`<button role="tab" class="segtab" aria-selected="${t===k}" data-act="cTab" data-t="${k}">${ic(i)}<span>${l}</span></button>`).join('')}</div>
  <div id="cBody" class="stack"></div></div>
  ${can?`<button class="btn pri big fab" data-act="${t==='factures'?'factEdit':t==='assurances'?'assEdit':'fourEdit'}" data-id="">${ic('plus')}${t==='factures'?'Facture':t==='assurances'?'Assurance':'Fournisseur'}</button>`:''}`;
  this.update()},
 update(){const B=$('#cBody');if(!B)return;const t=S.cTab||'factures';if(t==='factures')factView(B);else if(t==='assurances')assView(B);else fourView(B)}};

/* Factures */
const factYear=f=>String(f.annee||String(f.date||'').slice(0,4));
function factView(B){const F=S.cF||{annee:today().slice(0,4),four:'',st:'tout'};if(!F.annee)F.annee=today().slice(0,4);S.cF=F;
 const years=[...new Set([today().slice(0,4),...(S.factures||[]).map(factYear)])].filter(Boolean).sort().reverse();
 const L=(S.factures||[]).filter(f=>factYear(f)===F.annee&&(!F.four||f.four===F.four)&&(F.st==='tout'||(F.st==='impaye'?factReste(f)>0:factReste(f)<=0)));
 const tot=L.reduce((t,f)=>t+(Number(f.montant)||0),0),pay=L.reduce((t,f)=>t+factPaye(f),0);const Z=S.zipState?.[F.annee];
 B.innerHTML=`<section class="card stack" style="gap:10px"><div class="row" style="gap:8px;flex-wrap:wrap;align-items:center"><b>Année</b><div class="chips">${years.map(y=>`<button class="chip" aria-pressed="${F.annee===y}" data-act="factYear" data-y="${y}">${y}</button>`).join('')}</div></div>
  <div class="fgrid"><label class="f">Fournisseur<select class="inp" id="cf-four"><option value="">Tous</option>${fourList().map(x=>`<option value="${esc(x.id)}" ${F.four===x.id?'selected':''}>${esc(x.nom)}</option>`).join('')}</select></label>
  <label class="f">Statut<select class="inp" id="cf-st">${[['tout','Toutes'],['impaye','Non soldées'],['paye','Soldées']].map(([k,l])=>`<option value="${k}" ${F.st===k?'selected':''}>${l}</option>`).join('')}</select></label></div>
  <div class="row" style="gap:8px;flex-wrap:wrap;align-items:center"><button class="btn ghost" data-act="factZip" ${Z?.statut==='en_cours'?'disabled':''}>${ic('box')}${Z?.statut==='en_cours'?'Préparation du ZIP…':'Télécharger les factures '+esc(F.annee)+' (ZIP)'}</button>${Z?.statut==='pret'&&Z.url?`<a class="btn pri" href="${esc(Z.url)}" download="factures-${esc(F.annee)}.zip" target="_blank" rel="noopener">${ic('right')}Ouvrir le ZIP (${Z.factures} factures, ${Math.max(1,Math.round((Z.taille||0)/1048576))} Mo)</a>`:''}${Z?.statut==='erreur'?'<span class="small" style="color:var(--bad)">Échec de la préparation. Réessayez.</span>':''}</div></section>
 <div class="mini-kpis card"><div class="kpi"><b>${MAD0(tot)}</b><span class="small muted">${L.length} facture(s) en ${esc(F.annee)}</span></div><div class="kpi"><b>${MAD0(pay)}</b><span class="small muted">payé</span></div><div class="kpi"><b style="color:${tot-pay>0.5?'var(--bad)':'var(--ok)'}">${MAD0(tot-pay)}</b><span class="small muted">reste à payer</span></div></div>
 <section class="card" style="padding-block:4px">${L.length?L.map(f=>{const r=factReste(f);return `<div class="li" style="cursor:pointer" data-act="factEdit" data-id="${esc(f.id)}"><div class="grow"><div class="t">${esc(fourName(f.four)||f.fourNom||'Fournisseur')}${f.num?` <span class="small muted">n° ${esc(f.num)}</span>`:''}</div>
  <div class="s">${esc(fmtDate(f.date,{day:'numeric',month:'short',year:'numeric'}))} · ${esc(f.cat||'')}${(f.photos||[]).length?' · '+f.photos.length+' fichier(s)':' · <b style="color:var(--bad)">sans fichier</b>'}${(f.paiements||[]).length?' · '+f.paiements.length+' paiement(s)':''}</div></div>
  <div style="text-align:right"><b class="num">${MAD0(f.montant)}</b><div>${r>0.5?`<span class="pill bad">reste ${MAD0(r)}</span>`:'<span class="pill ok">soldée</span>'}</div></div></div>`}).join(''):'<div class="empty"><strong>Aucune facture pour '+esc(F.annee)+'</strong>Ajoutez une facture avec le bouton « Facture » : photo ou PDF, fournisseur, année, montant et paiements.</div>'}</section>`;
 const up=()=>{S.cF={...F,four:$('#cf-four').value,st:$('#cf-st').value};factView(B)};['#cf-four','#cf-st'].forEach(k=>$(k).onchange=up)}
async function factZip(){const y=S.cF?.annee||today().slice(0,4);S.zipState=S.zipState||{};S.zipState[y]={statut:'en_cours'};Views.compta.update();
 if(!await W(()=>S.db.collection('exportsDemande').add({annee:y,by:S.uid,ts:Date.now()}))){S.zipState[y]=null;Views.compta.update();return}
 toast('Préparation du ZIP… (une à deux minutes)');S.subs.zip?.();S.subs.zip=S.db.doc('exports/factures-'+y).onSnapshot(s=>{const d=s.data();if(!d||d.ts<Date.now()-600000)return;S.zipState[y]=d;Views.compta.update();if(d.statut!=='en_cours'){S.subs.zip?.();S.subs.zip=null;if(d.statut==='pret')toast('ZIP prêt : touchez « Ouvrir le ZIP ».')}},e=>console.warn(e))}
function factEdit(id){const f0=(S.factures||[]).find(x=>x.id===id)||{date:today(),montant:'',cat:'Consommables',photos:[],paiements:[]};const f=JSON.parse(JSON.stringify(f0));const ro=!perm('compta_edit');
 f.photos=f.photos||[];f.paiements=f.paiements||[];
 const d=openModal({title:f.id?'Facture':'Nouvelle facture',ok:ro?null:'Enregistrer',cancel:ro?'Fermer':'Annuler',del:f.id&&!ro?'Supprimer':null,
  body:`<fieldset class="fs" ${ro?'disabled':''}><div class="fgrid"><label class="f">Fournisseur<select class="inp" name="four" id="fa-four" required><option value="">— Choisir —</option>${fourList().map(x=>`<option value="${esc(x.id)}" ${f.four===x.id?'selected':''}>${esc(x.nom)}</option>`).join('')}<option value="__new">+ Nouveau fournisseur…</option></select></label>
  <label class="f">Catégorie<select class="inp" name="cat" id="fa-cat">${FACT_CATS.map(c=>`<option ${f.cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select></label></div>
  <div class="fgrid"><label class="f">Année de la facture<select class="inp" name="annee" id="fa-annee">${Array.from({length:8},(_,i)=>String(+today().slice(0,4)+1-i)).map(y=>`<option ${String(f.annee||String(f.date||today()).slice(0,4))===y?'selected':''}>${y}</option>`).join('')}</select></label><label class="f">Date de la facture<input class="inp" type="date" name="date" id="fa-date" value="${esc(f.date)}" required></label><label class="f">N° de facture<input class="inp" name="num" id="fa-num" value="${esc(f.num||'')}"></label><label class="f">Montant (DH)<input class="inp num" type="number" step="0.01" min="0" name="montant" id="fa-mt" value="${esc(f.montant)}" required></label></div>
  <div class="stack" style="gap:6px"><b>Facture (photo ou PDF)</b><div class="cthumbs" id="fa-ph">${thumbsHTML(f.photos,ro?'':'ph')}</div>${ro?'':`<button type="button" class="btn ghost" id="fa-addph" style="align-self:flex-start">${ic('img')}Photo ou PDF de la facture</button>`}</div>
  <div class="stack" style="gap:8px"><b>Paiements</b><div id="fa-pays" class="stack" style="gap:6px"></div>${ro?'':`<button type="button" class="btn ghost" id="fa-addpay" style="align-self:flex-start">${ic('plus')}Ajouter un paiement</button>`}</div>
  <label class="f">Note<input class="inp" name="note" id="fa-note" value="${esc(f.note||'')}"></label></fieldset>`,
  onOk:async v=>{if(!v.four||v.four==='__new'){toast('Choisissez le fournisseur.','err');return false}const mt=Number(String(v.montant).replace(',','.'));if(!(mt>=0)||v.montant===''){toast('Indiquez le montant.','err');return false}
   if(!f.photos.length&&!await ask('Aucune photo ni PDF de la facture. Enregistrer quand même ?','Enregistrer'))return false;
   const data={four:v.four,fourNom:fourName(v.four),annee:v.annee||String(v.date).slice(0,4),cat:v.cat,date:v.date,num:v.num.trim(),montant:mt,photos:f.photos,paiements:f.paiements.filter(p=>Number(p.montant)>0),note:v.note.trim(),maj:Date.now(),par:S.uid};
   return f.id?W(()=>S.db.doc('factures/'+f.id).update(data),'Facture enregistrée'):W(()=>S.db.collection('factures').add({...data,cree:Date.now(),creePar:S.uid}),'Facture ajoutée')},
  onDel:async()=>{if(!await ask('Supprimer cette facture ?','Supprimer'))return false;return W(()=>S.db.doc('factures/'+f.id).delete(),'Facture supprimée')}});
 const drawPays=()=>{$('#fa-pays',d).innerHTML=f.paiements.length?f.paiements.map((p,i)=>`<div class="paycard"><div class="fgrid"><label class="f">Date<input class="inp" type="date" data-pi="${i}" data-k="date" value="${esc(p.date||'')}"></label><label class="f">Montant<input class="inp num" type="number" step="0.01" data-pi="${i}" data-k="montant" value="${esc(p.montant||'')}"></label>
   <label class="f">Mode<select class="inp" data-pi="${i}" data-k="mode">${Object.entries(PAY_MODES).map(([k,l])=>`<option value="${k}" ${p.mode===k?'selected':''}>${l}</option>`).join('')}</select></label></div>
   <div class="row" style="gap:6px;align-items:center"><div class="cthumbs">${thumbsHTML(p.photos,ro?'':'pp'+i)}</div><span class="sp"></span>${ro?'':`<button type="button" class="btn ghost" data-payph="${i}">${ic('img')}Preuve de paiement</button><button type="button" class="ib" data-paydel="${i}" aria-label="Retirer">${ic('trash')}</button>`}</div></div>`).join(''):'<div class="small muted">Aucun paiement enregistré.</div>'};
 drawPays();
 d.addEventListener('input',e=>{const el=e.target.closest('[data-pi]');if(el){const p=f.paiements[+el.dataset.pi];p[el.dataset.k]=el.dataset.k==='montant'?Number(el.value):el.value}});
 d.addEventListener('change',e=>{const el=e.target.closest('[data-pi]');if(el){const p=f.paiements[+el.dataset.pi];p[el.dataset.k]=el.dataset.k==='montant'?Number(el.value):el.value}});
 d.addEventListener('click',async e=>{const rm=e.target.closest('[data-rm]');if(rm){const k=rm.dataset.rm,i=+rm.dataset.i;if(k==='ph'){f.photos.splice(i,1);$('#fa-ph',d).innerHTML=thumbsHTML(f.photos,'ph')}else{f.paiements[+k.slice(2)].photos.splice(i,1);drawPays()}return}
  const pp=e.target.closest('[data-payph]');if(pp){const fs=await pickFiles('image/*,application/pdf',true);if(!fs.length)return;const up=await uploadFiles(fs);const p=f.paiements[+pp.dataset.payph];p.photos=[...(p.photos||[]),...up];drawPays();return}
  const pd=e.target.closest('[data-paydel]');if(pd){f.paiements.splice(+pd.dataset.paydel,1);drawPays()}});
 if(!ro){$('#fa-addph',d).onclick=async()=>{if(!S.assets){toast('Envoi de fichiers indisponible.','err');return}const fs=await pickFiles('image/*,application/pdf',true);if(!fs.length)return;f.photos.push(...await uploadFiles(fs));$('#fa-ph',d).innerHTML=thumbsHTML(f.photos,'ph')};
  $('#fa-addpay',d).onclick=()=>{const reste=Math.max(0,(Number($('#fa-mt',d).value)||0)-factPaye(f));f.paiements.push({date:today(),montant:reste||'',mode:'virement',photos:[]});drawPays()};
  $('#fa-date',d).onchange=e=>{if(e.target.value)$('#fa-annee',d).value=e.target.value.slice(0,4)};
  $('#fa-four',d).onchange=e=>{if(e.target.value==='__new'){e.target.value='';toast('Ajoutez d\'abord le fournisseur dans l\'onglet « Fournisseurs ».')}}}}

/* Assurances */
function assView(B){const F=S.aF||{from:today().slice(0,7)+'-01',to:today(),sel:[]};S.aF=F;const comps=[...new Set([...ASSUREURS,...(S.assur||[]).map(a=>a.assureur)])].filter(Boolean);
 const L=(S.assur||[]).filter(a=>(!F.from||a.date>=F.from)&&(!F.to||a.date<=F.to)&&(!F.sel.length||F.sel.includes(a.assureur)));
 const tot=L.reduce((t,a)=>t+(Number(a.montant)||0),0);const per={};L.forEach(a=>{const o=per[a.assureur]=per[a.assureur]||{n:0,t:0};o.n++;o.t+=Number(a.montant)||0});
 B.innerHTML=`<section class="card stack" style="gap:10px"><h3>Calcul des montants déclarés</h3><div class="fgrid"><label class="f">Du<input class="inp" type="date" id="af-from" value="${esc(F.from)}"></label><label class="f">Au<input class="inp" type="date" id="af-to" value="${esc(F.to)}"></label></div>
  <div class="small muted">Compagnies (aucune sélection = toutes) :</div><div class="chips">${comps.map(c=>`<button class="chip" aria-pressed="${F.sel.includes(c)}" data-act="assSel" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>
  <div class="mini-kpis"><div class="kpi"><b>${MAD0(tot)}</b><span class="small muted">total déclaré</span></div><div class="kpi"><b>${L.length}</b><span class="small muted">feuille(s) de soins</span></div></div>
  ${Object.keys(per).length>1?`<div class="list">${Object.entries(per).sort((a,b)=>b[1].t-a[1].t).map(([k,o])=>`<div class="li"><div class="grow"><div class="t">${esc(k)}</div><div class="s">${o.n} feuille(s)</div></div><b class="num">${MAD0(o.t)}</b></div>`).join('')}</div>`:''}</section>
 <section class="card" style="padding-block:4px">${L.length?L.map(a=>`<div class="li" style="cursor:pointer" data-act="assEdit" data-id="${esc(a.id)}"><div class="grow"><div class="t">${esc(a.patient||'Patient')}</div><div class="s">${esc(a.assureur||'')} · ${esc(fmtDate(a.date,{day:'numeric',month:'short',year:'numeric'}))}${a.acte?' · '+esc(a.acte):''}</div></div><div style="text-align:right"><b class="num">${MAD0(a.montant)}</b><div><span class="pill ${a.statut==='rembourse'?'ok':''}">${esc(ASS_STATUTS[a.statut]||'Feuille remplie')}</span></div></div></div>`).join(''):'<div class="empty"><strong>Aucune feuille d\'assurance sur cette période</strong></div>'}</section>`;
 const up=()=>{F.from=$('#af-from').value;F.to=$('#af-to').value;assView(B)};$('#af-from').onchange=up;$('#af-to').onchange=up}
function assEdit(id){const a=(S.assur||[]).find(x=>x.id===id)||{date:today(),assureur:'CNOPS',statut:'rempli'};const ro=!perm('compta_edit');S.patPick={};
 const d=openModal({title:a.id?'Feuille d\'assurance':'Nouvelle feuille d\'assurance',ok:ro?null:'Enregistrer',cancel:ro?'Fermer':'Annuler',del:a.id&&!ro?'Supprimer':null,
  body:`<fieldset class="fs" ${ro?'disabled':''}><label class="f">Patient<input class="inp" name="patient" id="as-pat" value="${esc(a.patient||'')}" autocomplete="off" required></label>
  <div class="fgrid"><label class="f">Compagnie d'assurance<input class="inp" name="assureur" id="as-comp" list="dl-ass" value="${esc(a.assureur||'')}" required></label><label class="f">Date<input class="inp" type="date" name="date" id="as-date" value="${esc(a.date)}" required></label></div>
  <div class="fgrid"><label class="f">Montant déclaré (DH)<input class="inp num" type="number" step="0.01" min="0" name="montant" id="as-mt" value="${esc(a.montant??'')}" required></label><label class="f">Statut<select class="inp" name="statut" id="as-st">${Object.entries(ASS_STATUTS).map(([k,l])=>`<option value="${k}" ${a.statut===k?'selected':''}>${l}</option>`).join('')}</select></label></div>
  <label class="f">Soins déclarés<input class="inp" name="acte" id="as-acte" value="${esc(a.acte||'')}" placeholder="Ex. : Couronne zircone 36, détartrage"></label>
  <datalist id="dl-ass">${ASSUREURS.map(x=>`<option value="${esc(x)}">`).join('')}</datalist></fieldset>`,
  onOk:async v=>{const mt=Number(String(v.montant).replace(',','.'));if(!v.patient.trim()||!v.assureur.trim()||!(mt>=0)||v.montant===''){toast('Indiquez le patient, la compagnie et le montant.','err');return false}
   const pk=S.patPick[v.patient];const data={patient:(pk?.nom||v.patient).trim(),patientId:pk?.id||a.patientId||null,assureur:v.assureur.trim(),date:v.date,montant:mt,statut:v.statut,acte:v.acte.trim(),maj:Date.now(),par:S.uid};
   return a.id?W(()=>S.db.doc('assurances/'+a.id).update(data),'Feuille enregistrée'):W(()=>S.db.collection('assurances').add({...data,cree:Date.now(),creePar:S.uid}),'Feuille ajoutée')},
  onDel:async()=>{if(!await ask('Supprimer cette feuille d\'assurance ?','Supprimer'))return false;return W(()=>S.db.doc('assurances/'+a.id).delete(),'Feuille supprimée')}});
 if(!ro&&(perm('pat_voir')||perm('pat_liste')))patSuggest($('#as-pat',d))}

/* Fournisseurs et laboratoires */
function fourStats(id){const F=(S.factures||[]).filter(f=>f.four===id);const t=F.reduce((s,f)=>s+(Number(f.montant)||0),0),p=F.reduce((s,f)=>s+factPaye(f),0);return{n:F.length,t,p,r:t-p}}
function contactBtns(x){return `${x.tel?`<a class="ib" href="tel:${esc(telLink(x.tel))}" aria-label="Appeler" title="Appeler">${ic('phone')}</a>`:''}${(x.wa||x.tel)?`<a class="ib" href="${esc(waLink(x.wa||x.tel))}" target="_blank" rel="noopener" aria-label="WhatsApp" title="WhatsApp">${ic('chat')}</a>`:''}${x.email?`<a class="ib" href="mailto:${esc(x.email)}" aria-label="E-mail" title="E-mail">${ic('mail')}</a>`:''}`}
function fourView(B){const L=fourList();const money=perm('compta_voir');
 B.innerHTML=Object.entries(FOUR_TYPES).map(([k,l])=>{const G=L.filter(x=>(x.type||'materiel')===k);if(!G.length)return '';
  return `<section class="card" style="padding-block:4px"><h3 style="padding:10px 2px 4px">${esc(l)}s</h3>${G.map(x=>{const st=money?fourStats(x.id):null;return `<div class="li"><div class="grow" style="cursor:pointer" data-act="fourOpen" data-id="${esc(x.id)}"><div class="t">${esc(x.nom)}</div><div class="s">${esc([x.contact,x.tel,x.ville].filter(Boolean).join(' · ')||'Aucun contact')}</div>${st&&st.n?`<div class="s">${st.n} facture(s) · payé ${MAD0(st.p)}${st.r>0.5?` · <b style="color:var(--bad)">doit ${MAD0(st.r)}</b>`:' · soldé'}</div>`:''}</div><div class="row" style="gap:4px">${contactBtns(x)}</div></div>`}).join('')}</section>`}).join('')||'<div class="card"><div class="empty"><strong>Aucun fournisseur enregistré</strong>Ajoutez vos laboratoires et vos fournisseurs de matériel avec leurs coordonnées (téléphone, WhatsApp, e-mail).</div></div>'}
function fourOpen(id){const x=S.four?.[id];if(!x)return;const money=perm('compta_voir');const st=money?fourStats(id):null;

async function patDates(pid,date,statut){if(!pid||!S.db)return;try{const s=await S.db.doc('patients/'+pid).get();if(!s.exists)return;const p=s.data();const up={};
 if(statut==='termine'&&(!p.derniereVisite||date>p.derniereVisite))up.derniereVisite=date;
 if(date>=today()&&!['annule','absent','termine'].includes(statut)&&(!p.prochainRdv||p.prochainRdv<today()||date<p.prochainRdv))up.prochainRdv=date;
 if(Object.keys(up).length)await S.db.doc('patients/'+pid).update(up)}catch(e){console.warn(e)}}
Views.rappels={mount(el){const m=S.rcM||6;el.innerHTML=`<div class="stack"><div class="head"><div><div class="eyebrow">Patients</div><h1>Rappels de contrôle</h1><div class="muted">Patients sans visite depuis ${m} mois et sans rendez-vous à venir.</div></div><span class="sp"></span>${S.isOwner?`<button class="btn ghost" data-act="rcCalc">${ic('refresh')}Recalculer</button>`:''}</div>${banners()}
  <div class="chips">${[6,12,24].map(x=>`<button class="chip" aria-pressed="${m===x}" data-act="rcM" data-m="${x}">${x} mois</button>`).join('')}</div><div id="rcInfo" class="small muted"></div><section class="card" style="padding-block:4px" id="rcList"><div class="small muted" style="padding:12px">Chargement…</div></section></div>`;loadRappels()},update(){}};
async function loadRappels(){const L=$('#rcList');if(!L)return;const m=S.rcM||6;const lim=new Date();lim.setMonth(lim.getMonth()-m);const cut=lim.toISOString().slice(0,10);
 let rows=[];try{const s=await S.db.collection('patients').where('derniereVisite','<=',cut).orderBy('derniereVisite','desc').limit(200).get();rows=s.docs.map(d=>({id:d.id,...d.data()}))}catch(e){L.innerHTML=`<div class="empty"><strong>Chargement impossible</strong>${esc(e.code||'')}</div>`;return}
 const recent=Date.now()-60*864e5;rows=rows.filter(p=>p.nom&&!(p.prochainRdv>=today())&&!(p.rappelLe>recent));
 const I=$('#rcInfo');if(I)I.textContent=S.cfg?.rappelsCalc?.ts?`Dates de visite calculées le ${new Date(S.cfg.rappelsCalc.ts).toLocaleDateString('fr-FR')}. ${rows.length} patient(s) à rappeler (200 plus récents).`:'Le Docteur doit d\'abord lancer « Recalculer » une fois.';
 L.innerHTML=rows.length?rows.map(p=>{const dep=p.derniereVisite?fmtDate(p.derniereVisite,{month:'long',year:'numeric'}):'';return `<div class="li"><div class="grow" style="cursor:pointer" data-act="openPat" data-id="${esc(p.id)}"><div class="t">${esc(patName(p))}</div><div class="s">Dernière visite : ${esc(dep)}${p.tel?' · '+esc(p.tel):''}</div></div>
  ${p.tel?`<a class="btn ghost" href="${esc(waLink(p.tel,fillMsg(msgTpl('recall'),{patient:patName(p),depuis:dep})))}" target="_blank" rel="noopener" data-rcok="${esc(p.id)}">${ic('chat')}WhatsApp</a>`:''}<button class="ib" data-rcok="${esc(p.id)}" title="Marquer comme contacté">${ic('check')}</button></div>`}).join(''):'<div class="empty"><strong>Aucun patient à rappeler</strong></div>';
 L.onclick=e=>{const x=e.target.closest('[data-rcok]');if(!x)return;S.db.doc('patients/'+x.dataset.rcok).update({rappelLe:Date.now()}).catch(()=>{});if(x.tagName==='BUTTON'){x.closest('.li').remove();toast('Marqué comme contacté')}}}
async function rcCalc(a){if(!await ask('Recalculer la dernière visite et le prochain rendez-vous de tous les patients ? (quelques minutes, à faire une fois puis de temps en temps)','Recalculer'))return;
 a.disabled=true;const last={},next={};let n=0,cur=null;const t=today();
 try{for(;;){let q=S.db.collection('rdv').orderBy(firebase.firestore.FieldPath.documentId()).limit(2000);if(cur)q=q.startAfter(cur);const s=await q.get();if(s.empty)break;
   s.docs.forEach(d=>{const r=d.data();const p=r.patientId;if(!p||!r.date)return;if(r.date<t&&!['annule','absent'].includes(r.statut)){if(!last[p]||r.date>last[p])last[p]=r.date}
    else if(r.date>=t&&!['annule','absent'].includes(r.statut)){if(!next[p]||r.date<next[p])next[p]=r.date}});n+=s.size;cur=s.docs[s.docs.length-1];a.textContent=`Lecture… ${n} rendez-vous`}
  const ids=[...new Set([...Object.keys(last),...Object.keys(next)])];let w=0;
  for(let i=0;i<ids.length;i+=400){const b=S.db.batch();ids.slice(i,i+400).forEach(id=>b.set(S.db.doc('patients/'+id),{derniereVisite:last[id]||'',prochainRdv:next[id]||''},{merge:true}));await b.commit();w+=Math.min(400,ids.length-i);a.textContent=`Mise à jour… ${w}/${ids.length}`}
  await S.db.doc('cfg/rappelsCalc').set({ts:Date.now(),patients:ids.length,rdv:n});toast(`${ids.length} patients mis à jour.`);loadRappels()}catch(e){console.warn(e);toast(errMsg(e),'err')}a.disabled=false;a.innerHTML=ic('refresh')+'Recalculer'}

 const c=$('#sigc',d),g=c.getContext('2d');g.lineWidth=3;g.lineCap='round';g.lineJoin='round';g.strokeStyle='#111';let dr=false,used=false;
 const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
 c.onpointerdown=e=>{dr=true;used=true;c.setPointerCapture(e.pointerId);const[x,y]=pt(e);g.beginPath();g.moveTo(x,y)};c.onpointermove=e=>{if(!dr)return;const[x,y]=pt(e);g.lineTo(x,y);g.stroke()};c.onpointerup=()=>dr=false;

/* ================= Tableau de bord (statistiques) ================= */
function barsSVG(rows,fmt){// rows: [[label,value]]  — une seule série, une seule couleur, barres fines arrondies
 const W=640,H=200,pl=8,pr=8,pt=18,pb=26,n=rows.length||1,max=Math.max(1,...rows.map(r=>r[1]));const bw=Math.min(28,(W-pl-pr)/n*.62),step=(W-pl-pr)/n;
 const y=v=>pt+(H-pt-pb)*(1-v/max);const best=rows.reduce((b,r,i)=>r[1]>(rows[b]?.[1]??-1)?i:b,0);
 return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img">${[0.5,1].map(f=>`<line x1="${pl}" x2="${W-pr}" y1="${y(max*f)}" y2="${y(max*f)}" class="grid"/>`).join('')}<line x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}" class="axis"/>
 ${rows.map((r,i)=>{const x=pl+step*i+(step-bw)/2,h=Math.max(r[1]>0?2:0,(H-pt-pb)*r[1]/max);return `<g class="bar"><rect x="${pl+step*i}" y="${pt}" width="${step}" height="${H-pt-pb}" fill="transparent"/><path d="M${x},${H-pb} v${-Math.max(0,h-4)} q0,-4 4,-4 h${bw-8} q4,0 4,4 v${Math.max(0,h-4)} z" class="mark"/><title>${esc(r[0])} : ${esc(fmt(r[1]))}</title>
  ${i===best||i===n-1?`<text x="${x+bw/2}" y="${y(r[1])-5}" class="val">${esc(fmt(r[1]))}</text>`:''}<text x="${x+bw/2}" y="${H-8}" class="lab">${esc(r[0])}</text></g>`}).join('')}</svg>`}
function hbarsHTML(rows,fmt){const max=Math.max(1,...rows.map(r=>r[1]));return `<div class="list">${rows.map(r=>`<div class="li" title="${esc(r[0])} : ${esc(fmt(r[1]))}"><span style="width:12ch" class="small">${esc(r[0])}</span><div class="grow"><div class="progress"><i style="width:${Math.round(r[1]/max*100)}%"></i></div></div><span class="num small" style="min-width:9ch;text-align:right">${esc(fmt(r[1]))}</span></div>`).join('')}</div>`}

async function loadStats(){const O=$('#stO');if(!O)return;const d0=new Date();d0.setMonth(d0.getMonth()-11);const from=d0.toISOString().slice(0,7)+'-01';
 let L=[];try{const s=await S.db.collection('rapports').where('date','>=',from).get();L=s.docs.map(d=>d.data())}catch(e){O.innerHTML=`<div class="banner">${esc(errMsg(e))}</div>`;return}
 const months=[];for(let i=0;i<12;i++){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-11+i);months.push(d.toISOString().slice(0,7))}
 const M={};months.forEach(m=>M[m]={ca:0,lg:0,rdv:0,ter:0,abs:0,nv:0,jours:0});const T={};
 L.forEach(R=>{const m=(R.date||'').slice(0,7);const o=M[m];if(!o)return;o.jours++;o.ca+=R.caisse?.total||0;o.lg+=R.logiciel?.total||0;o.rdv+=(R.rdv?.total||0)-(R.rdv?.annules||0);o.ter+=R.rdv?.termines||0;o.abs+=R.rdv?.absents||0;o.nv+=(R.nouveauxPatients||[]).length;
  Object.entries(R.rdv?.parType||{}).forEach(([k,v])=>T[k]=(T[k]||0)+v)});
 const lab=m=>new Date(m+'-15').toLocaleDateString('fr-FR',{month:'short'}).replace('.','');const tot=k=>months.reduce((t,m)=>t+M[m][k],0);
 const enc=tot('ca')+tot('lg'),ter=tot('ter'),abs=tot('abs'),rdv=tot('rdv');
 if(!L.length){O.innerHTML='<div class="card"><div class="empty"><strong>Pas encore de données</strong>Le tableau de bord se remplit avec les rapports quotidiens. Dans « Rapports », choisissez « Année » puis « Générer les jours manquants » pour remplir les mois passés.</div></div>';return}
 O.innerHTML=`<div class="mini-kpis card"><div class="kpi"><b>${MAD0(enc)}</b><span class="small muted">encaissé sur 12 mois</span></div><div class="kpi"><b>${ter}</b><span class="small muted">séances réalisées</span></div><div class="kpi"><b style="color:${rdv&&abs/rdv>.1?'var(--bad)':'inherit'}">${rdv?Math.round(abs/rdv*100):0} %</b><span class="small muted">de rendez-vous manqués</span></div><div class="kpi"><b>${tot('nv')}</b><span class="small muted">nouveaux patients</span></div></div>
 <section class="card"><h3>Encaissements par mois</h3><div class="small muted">Caisse de l'application${tot('lg')?' + paiements saisis dans le logiciel du cabinet':''}.</div>${barsSVG(months.map(m=>[lab(m),M[m].ca+M[m].lg]),MAD0)}</section>
 <div class="grid2"><section class="card"><h3>Séances réalisées par mois</h3>${barsSVG(months.map(m=>[lab(m),M[m].ter]),v=>String(v))}</section>
 <section class="card"><h3>Rendez-vous manqués (%)</h3>${barsSVG(months.map(m=>[lab(m),M[m].rdv?Math.round(M[m].abs/M[m].rdv*100):0]),v=>v+' %')}</section></div>
 <div class="grid2"><section class="card"><h3>Nouveaux patients par mois</h3>${barsSVG(months.map(m=>[lab(m),M[m].nv]),v=>String(v))}</section>
 <section class="card"><h3>Rendez-vous par type de soin</h3>${hbarsHTML(Object.entries(T).sort((a,b)=>b[1]-a[1]).slice(0,10),v=>String(v))}</section></div>
 <details class="card"><summary class="small" style="cursor:pointer;font-weight:600">Tableau des données</summary><div class="tablewrap"><table><thead><tr><th>Mois</th><th class="r">Encaissé</th><th class="r">Séances</th><th class="r">Manqués</th><th class="r">Nouveaux patients</th><th class="r">Jours</th></tr></thead><tbody>${months.map(m=>`<tr><td>${esc(fmtMonth(m))}</td><td class="r num">${MAD0(M[m].ca+M[m].lg)}</td><td class="r num">${M[m].ter}</td><td class="r num">${M[m].abs}</td><td class="r num">${M[m].nv}</td><td class="r num">${M[m].jours}</td></tr>`).join('')}</tbody></table></div></details>`}

function recaptcha(){let el=$('#recap');if(!el){el=document.createElement('div');el.id='recap';document.body.appendChild(el)}
 if(S.recap){try{S.recap.clear()}catch(e){}}S.recap=new firebase.auth.RecaptchaVerifier('recap',{size:'invisible'});return S.recap}
function askCode(title,msg){return new Promise(res=>{const d=$('#ask');d.innerHTML=`<div class="dlg-in"><header><h2>${esc(title)}</h2></header><div class="dlg-b"><p style="margin:0">${esc(msg)}</p><input class="inp" id="mfa-c" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456" style="font-size:1.4rem;letter-spacing:.3em;text-align:center"></div><footer><span class="sp"></span><button class="btn ghost" id="mfa-n">Annuler</button><button class="btn pri" id="mfa-y">Valider</button></footer></div>`;
 const v=()=>{const c=$('#mfa-c',d).value.replace(/\D/g,'');if(c.length<6){toast('Code à 6 chiffres.','err');return}d.close();res(c)};$('#mfa-y',d).onclick=v;$('#mfa-c',d).onkeydown=e=>{if(e.key==='Enter')v()};$('#mfa-n',d).onclick=()=>{d.close();res(null)};d.onclose=null;d.showModal();setTimeout(()=>$('#mfa-c',d).focus(),50)})}
async function loginMFA(err){const r=err.resolver;const hint=r.hints[0];
 try{const vid=await new firebase.auth.PhoneAuthProvider().verifyPhoneNumber({multiFactorHint:hint,session:r.session},recaptcha());
  const code=await askCode('Code de sécurité',`Un code a été envoyé par SMS au ${hint.phoneNumber||'téléphone enregistré'}.`);if(!code)return false;
  await r.resolveSignIn(firebase.auth.PhoneMultiFactorGenerator.assertion(firebase.auth.PhoneAuthProvider.credential(vid,code)));return true}catch(e){console.warn(e);toast(e.code==='auth/invalid-verification-code'?'Code incorrect.':authMsg(e),'err');return false}}
function mfaCard(){const u=firebase.auth?.().currentUser;if(!u||!S._owner||S.demo)return '';const f=(u.multiFactor?.enrolledFactors)||[];
 return `<section class="card stack" style="gap:8px"><h3>Double authentification</h3><div class="small muted">${f.length?`Activée : un code SMS est demandé au ${esc(f[0].phoneNumber||'')} à chaque nouvelle connexion.`:'Protège votre compte administrateur : en plus du mot de passe, un code reçu par SMS sera demandé à chaque nouvelle connexion.'}</div>
 ${f.length?`<button class="btn ghost" data-act="mfaOff" style="align-self:flex-start">Désactiver</button>`:`<div class="row" style="gap:8px"><input class="inp" id="mfa-tel" type="tel" placeholder="+212 6 61 00 00 00" style="flex:1;min-width:180px"><button class="btn pri" data-act="mfaOn">Activer</button></div>`}</section>`}
async function mfaOn(){const u=firebase.auth().currentUser;let tel=($('#mfa-tel')?.value||'').replace(/[^\d+]/g,'');if(tel.startsWith('0'))tel='+212'+tel.slice(1);if(!/^\+\d{9,15}$/.test(tel)){toast('Numéro au format +212…','err');return}
 try{const session=await u.multiFactor.getSession();const vid=await new firebase.auth.PhoneAuthProvider().verifyPhoneNumber({phoneNumber:tel,session},recaptcha());
  const code=await askCode('Vérification du téléphone','Saisissez le code reçu par SMS.');if(!code)return;
  await u.multiFactor.enroll(firebase.auth.PhoneMultiFactorGenerator.assertion(firebase.auth.PhoneAuthProvider.credential(vid,code)),'Téléphone');toast('Double authentification activée');go('equipe')}
 catch(e){console.warn(e);if(e.code==='auth/requires-recent-login'){toast('Par sécurité, déconnectez-vous puis reconnectez-vous, et réessayez.','err')}else if(e.code==='auth/operation-not-allowed'||/MFA|multi/i.test(e.message||'')&&e.code==='auth/invalid-argument'){toast('Activez d\'abord l\'authentification multifacteur par SMS dans la console Firebase (voir le guide).','err')}else toast(authMsg(e)+(e.code?' ('+e.code+')':''),'err')}}
async function mfaOff(){if(!await ask('Désactiver la double authentification ?','Désactiver'))return;const u=firebase.auth().currentUser;try{await u.multiFactor.unenroll(u.multiFactor.enrolledFactors[0]);toast('Désactivée');go('equipe')}catch(e){toast(e.code==='auth/requires-recent-login'?'Déconnectez-vous puis reconnectez-vous, et réessayez.':authMsg(e),'err')}}

 if(perm('mod_groupes')){const acc={};myGroups().forEach(g=>addSub(db.collection('messages').where('groupe','==',g.id).orderBy('ts','desc').limit(20).onSnapshot(s=>{acc[g.id]=s.docs.map(d=>({id:d.id,...d.data()}));S.latest=Object.values(acc).flat().sort((a,b)=>b.ts-a.ts);refresh('accueil','groupes')},w)))}
 if(perm('mod_stock')||perm('labo_voir'))addSub(db.collection('stock').onSnapshot(s=>{S.stock=s.docs.map(d=>({id:d.id,...d.data()}));refresh('stock','accueil','labo')},w));
 if(perm('labo_voir'))addSub(db.collection('labo').orderBy('maj','desc').limit(500).onSnapshot(s=>{S.labo=s.docs.map(d=>({id:d.id,...d.data()}));refresh('labo','accueil','patients');const P=$('#labPhotos');if(P){const c=S.labo.find(x=>x.id===P.dataset.id);if(c)P.innerHTML=labPhotosHTML(c)}},w));
 if(perm('compta_voir')||perm('mod_stock')||perm('labo_voir'))addSub(db.collection('fournisseurs').onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]={id:d.id,...d.data()});S.four=o;refresh('compta','stock','labo')},w));
 if(perm('compta_voir')){addSub(db.collection('factures').orderBy('date','desc').limit(1500).onSnapshot(s=>{S.factures=s.docs.map(d=>({id:d.id,...d.data()}));refresh('compta')},w));addSub(db.collection('assurances').orderBy('date','desc').limit(3000).onSnapshot(s=>{S.assur=s.docs.map(d=>({id:d.id,...d.data()}));refresh('compta')},w))}
 if(perm('mod_maint'))addSub(db.collection('equipements').onSnapshot(s=>{S.equip=s.docs.map(d=>({id:d.id,...d.data()}));refresh('maintenance','accueil')},w));
 if(perm('mod_steril'))addSub(db.collection('steril').orderBy('ts','desc').limit(300).onSnapshot(s=>{S.steril=s.docs.map(d=>({id:d.id,...d.data()}));refresh('sterilisation')},w));
 if(perm('coffre'))addSub(db.collection('coffre').onSnapshot(s=>{S.coffre=s.docs.map(d=>({id:d.id,...d.data()}));refresh('coffre','accueil')},w));
 if(perm('rdv_gerer'))addSub(db.collection('attente').onSnapshot(s=>{S.attente=s.docs.map(d=>({id:d.id,...d.data()}));refresh('agenda')},w));
 if(perm('mod_notes'))addSub(db.collection(`notes/${S.uid}/n`).onSnapshot(s=>{S.notes=s.docs.map(d=>({id:d.id,...d.data()}));refresh('notes')},w));
 if(perm('mod_checklists'))addSub(db.doc('routine/'+today()).onSnapshot(s=>{S.routine=s.exists?s.data():null;refresh('accueil','maintenance')},w));
 if(perm('mod_taches'))addSub(db.doc(`taches/${S.uid}/j/${today()}`).onSnapshot(s=>{S.myTaches=s.exists?s.data():null;refresh('accueil','taches')},w));
 if(perm('mod_checklists'))addSub(db.collection('executions').where('date','==',today()).onSnapshot(s=>{S.execToday=s.docs.map(d=>({id:d.id,...d.data()}));refresh('checklists','accueil')},w));
 if(perm('mod_pointage'))addSub(db.doc(`pointage/${S.uid}/j/${today()}`).onSnapshot(s=>{S.myPointage=s.exists?s.data():null;refresh('accueil','pointage')},w));
 if(perm('caisse'))addSub(db.collection(`recettes/${S.uid}/e`).where('date','==',today()).onSnapshot(s=>{S.myRecCount=s.size;S.myRec=s.docs.map(d=>({id:d.id,...d.data()}));refresh('caisse')},w));
 refresh();notifSilent()}
function restartData(){stopData();S.rdvToday=[];S.latest=[];S.stock=[];S.labo=[];S.execToday=[];startData()}
let membresAllSub=null;
function watchMembers(){if(membresAllSub)return;membresAllSub=S.db.collection('membres').onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());S.membres=m;S.membreLoaded=true;afterMembers()},e=>console.warn(e))}
let lastMine='';
function afterMembers(){const mine=JSON.stringify(S.membres[S.uid]||null);const changed=mine!==lastMine;lastMine=mine;renderMe();
 if(!S.isOwner&&statutOf(S.uid)==='actif')watchMembers();
 if(gated()){if(S.dataStarted)stopData()}else if(!S.dataStarted)startData();else if(changed&&!S.isOwner)restartData();
 if(S.view==='attente'||gated()||!allowedView(S.view))reroute();else refresh()}
async function boot(){
 S.dataSubs=[];S.membres={};
 const h=(location.hash||'').slice(1);if(Views[h])S.view=h;go('attente');
 const cfg=window.NS_CONFIG?.firebase;
 if(!window.firebase||!cfg||!cfg.apiKey||/COLLEZ|VOTRE/i.test(cfg.apiKey)){S.ready=true;S.db=null;go('attente');return}
 firebase.initializeApp(cfg);
 try{const k=window.NS_CONFIG?.appCheckKey;if(k&&firebase.appCheck)firebase.appCheck().activate(k,true)}catch(e){console.warn('App Check',e)}
 const db=firebase.firestore();try{db.settings({ignoreUndefinedProperties:true,merge:true})}catch(e){}
 try{await db.enablePersistence({synchronizeTabs:true})}catch(e){}
 S.db=db;
 const storage=firebase.storage();
 S.assets={async upload(blob,o){const type=(o&&o.type)||blob.type||'application/octet-stream';
   if(blob.size>20*1024*1024){const e=new Error('too_large');e.code='too_large';throw e}
   const ext=({'image/jpeg':'jpg','image/png':'png','application/pdf':'pdf','audio/webm':'webm','audio/mp4':'m4a','audio/aac':'aac','audio/mpeg':'mp3','video/mp4':'mp4','video/webm':'webm'})[type]||'bin';
   const ref=storage.ref(`uploads/${S.uid}/${uidGen()}.${ext}`);await ref.put(blob,{contentType:type});const url=await ref.getDownloadURL();return {id:url,url}},
  async delete(id){id=String(id||'');if(id.startsWith('fs:'))await db.doc('fichiers/'+id.slice(3)).delete();else if(/^https?:/.test(id))await storage.refFromURL(id).delete()}};
 window.addEventListener('online',()=>{S.offline=false;refresh()});window.addEventListener('offline',()=>{S.offline=true;refresh()});S.offline=!navigator.onLine;
 firebase.auth().onAuthStateChanged(async u=>{
  if(!u){if(S.authUser){location.reload();return}S.authUser=null;S.ready=true;go('attente');return}
  S.authUser=u;S.uid=u.uid;const email=(u.email||'').toLowerCase();const adminEmail=ADMINS.includes(email);
  S.isOwner=adminEmail&&u.emailVerified;S.adminUnverified=adminEmail&&!u.emailVerified;
  S.me={id:u.uid,name:u.displayName||'',email:u.email||'',avatarUrl:avatarFor(u.displayName||u.email),isOwner:S.isOwner};
  S.ready=true;renderMe();
  if(S.adminUnverified){go('attente');return}
  if(S.pendingSignup){const p=S.pendingSignup;S.pendingSignup=null;try{await db.doc('annuaire/'+u.uid).set({nom:p.nom,email:p.email,roleSouhaite:p.role,demandeLe:Date.now(),premiere:Date.now(),derniere:today()})}catch(e){console.warn(e)}}
  db.collection('cfg').onSnapshot(s=>{const c={};s.docs.forEach(d=>c[d.id]=d.data());const oldG=JSON.stringify(myGroups().map(g=>g.id));S.cfg=c;S.cfgLoaded=true;if(S.dataStarted)startSite();renderMe();
   if(S.dataStarted&&JSON.stringify(myGroups().map(g=>g.id))!==oldG)restartData();
   if(S.view==='attente'||gated()||!allowedView(S.view)){reroute()}else if(S.view==='caisse'&&(S.caisseTab||'saisie')==='saisie'&&!!c.caisse?.pub!==!!$('#caForm')&&!document.activeElement?.closest?.('#caForm')){go('caisse')}else refresh();if(!gated()&&!S.dataStarted)startData()},e=>{console.warn(e);S.cfgLoaded=true;reroute()});
  db.collection('annuaire').onSnapshot(s=>{const a={};s.docs.forEach(d=>a[d.id]=d.data());S.annuaire=a;S.annuaireLoaded=true;resolveProfiles();if(S.view==='attente'||gated())reroute()},e=>{console.warn(e);S.annuaireLoaded=true;reroute()});
  if(S.isOwner){watchMembers()}
  else db.doc('membres/'+u.uid).onSnapshot(s=>{if(s.exists)S.membres[u.uid]=s.data();else delete S.membres[u.uid];S.membreLoaded=true;afterMembers()},e=>{console.warn(e);S.membreLoaded=true;afterMembers()});
  try{const ref=db.doc('annuaire/'+u.uid);const s=await ref.get();
   if(!s.exists){if(S.isOwner)await ref.set({nom:u.displayName||'Dr Saadeddine Hafdi Idrissi',email:u.email,premiere:Date.now(),derniere:today(),proprietaire:true})}
   else if(s.data().derniere!==today())await ref.update({derniere:today()})}catch(e){console.warn(e)}
  if(S.isOwner){S.membreLoaded=true;startData();go(S.view==='attente'?'accueil':S.view)}
 });
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(e=>console.warn(e));
 setInterval(()=>{if(['accueil','pointage'].includes(S.view)&&!document.querySelector('dialog[open]'))refresh(S.view)},30000);
}
boot();
</script>
