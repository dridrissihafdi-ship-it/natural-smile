<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Natural Smile</title>
<meta name="description" content="Application interne de Natural Smile Dental Office et de son laboratoire.">
<meta name="theme-color" content="#fffdf9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1a18" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Natural Smile">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Great+Vibes&family=Figtree:wght@400;500;600;700&display=swap">
<style>
html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: "lit marble" — quiet stone surfaces; the only bold element is brushed-gold tiles (from the logo) and one backlit charcoal panel (from the signboard). Phone: floating tab bar; desktop: sidebar + 880px column. */
:root{
  --bg:#f1eee8; --surface:#fffdf9; --surface-2:#f2ede4; --line:#e6dfd2;
  --fg:#2e2d2b; --muted:#78726a; --accent:#8a6f42; --accent-fg:#ffffff; --accent-soft:#f4ede0;
  --gold-1:#dccaa3; --gold-2:#b79c6b; --gold-3:#8c7346; --charcoal:#4b4b4b;
  --panel:#2c2b29; --panel-fg:#f6efe2; --panel-gold:#f0d9a6; --glow:rgba(0,0,0,0);
  --shadow:0 1px 2px rgba(70,55,30,.05),0 10px 30px -18px rgba(70,55,30,.35);
  --ok:#2f7a4a; --ok-soft:#e1efe5; --warn:#94600c; --warn-soft:#f6ebd3; --bad:#a93a2f; --bad-soft:#f6e1dd; --badge:#b4562f;
  --bubble-me:#8a6f42; --bubble-me-fg:#ffffff;
  --f-display:"Poppins","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-script:"Great Vibes","Snell Roundhand","Apple Chancery",cursive;
  --r-lg:20px; --r:14px; --r-sm:10px; --navh:66px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121110; --surface:#1b1a18; --surface-2:#24221f; --line:#322e29;
  --fg:#efe9df; --muted:#a69f94; --accent:#d4b77f; --accent-fg:#1c1509; --accent-soft:#2c2518;
  --gold-1:#cdb37e; --gold-2:#a88b57; --gold-3:#7b6337; --charcoal:#ddd6cb;
  --panel:#1f1d1a; --panel-fg:#f3ebdc; --panel-gold:#f2d9a0; --glow:rgba(230,188,105,.32);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -18px rgba(0,0,0,.7);
  --ok:#62c283; --ok-soft:#173222; --warn:#e3a944; --warn-soft:#33270f; --bad:#ef7d70; --bad-soft:#3a1b17; --badge:#d9774a;
  --bubble-me:#4a3d25; --bubble-me-fg:#f5ecda; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#121110; --surface:#1b1a18; --surface-2:#24221f; --line:#322e29;
  --fg:#efe9df; --muted:#a69f94; --accent:#d4b77f; --accent-fg:#1c1509; --accent-soft:#2c2518;
  --gold-1:#cdb37e; --gold-2:#a88b57; --gold-3:#7b6337; --charcoal:#ddd6cb;
  --panel:#1f1d1a; --panel-fg:#f3ebdc; --panel-gold:#f2d9a0; --glow:rgba(230,188,105,.32);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -18px rgba(0,0,0,.7);
  --ok:#62c283; --ok-soft:#173222; --warn:#e3a944; --warn-soft:#33270f; --bad:#ef7d70; --bad-soft:#3a1b17; --badge:#d9774a;
  --bubble-me:#4a3d25; --bubble-me-fg:#f5ecda; color-scheme:dark }
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0;line-height:1.2;letter-spacing:-.01em}
h1{font-size:1.7rem}h2{font-size:1.2rem}h3{font-size:1.02rem}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.muted{color:var(--muted)}.small{font-size:.86rem}
.eyebrow{font-size:.88rem;color:var(--muted);font-weight:500}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gold{background:linear-gradient(145deg,var(--gold-1) 0%,var(--gold-2) 52%,var(--gold-3) 100%);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 22px var(--glow)}

/* shell */
.app{display:grid;grid-template-columns:1fr;min-height:100%}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{width:42px;height:42px;flex:none;display:block;filter:drop-shadow(0 0 10px var(--glow))}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:.92rem;line-height:1.15;letter-spacing:.09em;color:var(--charcoal);text-transform:uppercase}
.brand-sub{font-family:var(--f-script);font-size:1.15rem;line-height:1.1;color:var(--muted)}
.brand-sub,.brand-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.me-chip{display:flex;align-items:center;gap:8px;font-size:.86rem;color:var(--muted);min-width:0}
.me-chip img{width:32px;height:32px;border-radius:50%;box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--gold-2)}
.me-chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:22ch}
@media (max-width:520px){.brand-name .long{display:none}.me-chip span{display:none}}
.side{display:none}
.app.gated{grid-template-columns:1fr!important}.app.gated .side{display:none!important}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:22px calc(var(--navh) + 44px + env(safe-area-inset-bottom,0px));width:100%;max-width:900px;margin:0 auto;min-width:0}
.tabbar{position:fixed;z-index:6;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));
  height:var(--navh);background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);
  display:grid;grid-template-columns:repeat(5,1fr);padding-inline:4px}
.tab{background:none;border:0;padding:6px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.7rem;color:var(--muted);cursor:pointer;position:relative;border-radius:18px}
.tab svg{width:34px;height:30px;padding:4px 7px;border-radius:10px;transition:background .2s,color .2s}
.tab[aria-current="page"]{color:var(--fg);font-weight:600}
.tab[aria-current="page"] svg{background:linear-gradient(145deg,var(--gold-1),var(--gold-2) 55%,var(--gold-3));color:#fff;box-shadow:0 0 16px var(--glow)}
.badge{position:absolute;top:3px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--badge);color:#fff;font-size:.68rem;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px var(--surface)}
@media (min-width:960px){
  :root{--navh:0px}
  .app{grid-template-columns:248px 1fr}
  .top{grid-column:1/-1;padding-block:12px}
  .side{display:flex;flex-direction:column;gap:2px;padding:20px 12px;border-right:1px solid var(--line);background:var(--surface);
    position:sticky;top:calc(env(safe-area-inset-top,0px) + 67px);height:calc(100vh - 67px);overflow:auto;padding-left:max(12px,env(safe-area-inset-left,0px))}
  .tabbar{display:none}
  main{padding-block:32px 48px}
}
.nav-item{display:flex;align-items:center;gap:12px;padding:7px 10px;border-radius:12px;border:0;background:none;cursor:pointer;color:var(--fg);text-align:left;position:relative;font-weight:500;width:100%}
.nav-item svg{width:32px;height:32px;padding:6px;border-radius:9px;color:var(--muted);background:var(--surface-2);flex:none}
.nav-item:hover{background:var(--surface-2)}
.nav-item[aria-current="page"]{background:var(--accent-soft);font-weight:600}
.nav-item[aria-current="page"] svg{background:linear-gradient(145deg,var(--gold-1),var(--gold-2) 55%,var(--gold-3));color:#fff;box-shadow:0 0 14px var(--glow)}
.nav-item .badge{position:static;margin-left:auto;box-shadow:none}

/* components */
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row .sp{flex:1}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow);min-width:0}
.card.flat{background:var(--surface-2);border-color:transparent;box-shadow:none}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.card-h .sp{flex:1}
.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head .sp{flex:1}
.btn{border:1px solid transparent;border-radius:12px;padding:9px 15px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface-2);color:var(--fg);white-space:nowrap;transition:filter .15s,background .15s}
.btn:hover{filter:brightness(.97)}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn.big{padding:13px 20px;font-size:1rem;border-radius:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.ib{border:0;background:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
.ib:hover{background:var(--surface-2);color:var(--fg)}
.ib svg{width:20px;height:20px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.76rem;font-weight:600;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.acc{background:var(--accent-soft);color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.86rem;cursor:pointer;font-weight:500}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:.84rem;font-weight:600;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 13px;font-size:15px;color:var(--fg);min-width:0;transition:border-color .15s,box-shadow .15s}
.inp:focus{outline:none;border-color:var(--gold-2);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{resize:vertical;min-height:90px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600}
.li .s{font-size:.84rem;color:var(--muted);overflow-wrap:anywhere}
.empty{text-align:center;padding:30px 12px;color:var(--muted)}
.empty strong{display:block;color:var(--fg);font-family:var(--f-display);font-weight:600;font-size:1.02rem;margin-bottom:4px}
.banner{border-radius:var(--r);padding:12px 14px;background:var(--warn-soft);color:var(--warn);font-size:.92rem}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th{text-align:left;font-size:.8rem;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--f-display);font-weight:600;font-size:1.75rem;line-height:1.1}
.progress{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-1),var(--gold-3));border-radius:4px;transition:width .25s}
.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(var(--navh) + 24px + env(safe-area-inset-bottom,0px));z-index:4;border-radius:18px;box-shadow:0 10px 26px -8px rgba(60,45,20,.5)}

/* home */
.greet{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.greet h1{font-size:1.9rem}
.lit,.clock{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:22px;color:var(--panel-fg);
  background:radial-gradient(110% 120% at 85% -30%,rgba(232,196,120,.42),transparent 58%),radial-gradient(80% 90% at 0% 120%,rgba(232,196,120,.14),transparent 60%),var(--panel);
  display:grid;gap:14px;grid-template-columns:1fr;box-shadow:var(--shadow)}
.lit::after,.clock::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(240,217,166,.18);pointer-events:none}
.lit-time,.clock .bigtime{font-family:var(--f-display);font-weight:600;font-size:3.1rem;line-height:1;letter-spacing:-.02em;color:var(--panel-gold);text-shadow:0 0 28px rgba(240,200,120,.35)}
.lit-st,.clock .st{font-size:.95rem;opacity:.85;max-width:46ch}
.lit .btn,.clock .btn{justify-self:start;background:linear-gradient(145deg,#ecd9ad,#c6a96f);color:#2a2111;border:0;box-shadow:0 6px 20px -6px rgba(230,190,110,.6)}
.lit-label{font-size:.88rem;color:var(--panel-gold);opacity:.85}
@media(min-width:640px){.lit{grid-template-columns:auto 1fr auto;align-items:center;gap:24px}.lit .btn{justify-self:end}}
.tiles{display:grid;grid-template-columns:repeat(var(--cols,4),1fr);gap:14px 8px}
@media(min-width:640px){.tiles{grid-template-columns:repeat(var(--colsd,8),1fr)}}
.mtile{border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:.8rem;font-weight:500;color:var(--fg);position:relative;padding:0}
.mtile .gold{width:58px;height:58px;border-radius:17px;display:grid;place-items:center;transition:transform .15s}
.mtile .gold svg{width:28px;height:28px}
.mtile:hover .gold{transform:translateY(-2px)}
.mtile .badge{top:-4px;left:calc(50% + 16px)}
.mini-kpis{display:flex;gap:22px;flex-wrap:wrap;padding-block:6px 4px}
.timechip{font-family:var(--f-display);font-weight:600;font-size:.92rem;min-width:46px}

/* agenda */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:7px 2px;text-align:center;cursor:pointer;font-size:.74rem;color:var(--muted)}
.day b{display:block;font-family:var(--f-display);font-weight:600;font-size:1.05rem;color:var(--fg)}
.day[aria-pressed="true"]{background:linear-gradient(145deg,var(--gold-1),var(--gold-2) 55%,var(--gold-3));border-color:transparent;color:#fff;box-shadow:0 0 16px var(--glow)}
.day[aria-pressed="true"] b{color:#fff}
.day.today:not([aria-pressed="true"]) b{color:var(--accent)}
.rdv{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:13px 4px;border-bottom:1px solid var(--line)}
.rdv:last-child{border-bottom:0}
.rdv .h{font-family:var(--f-display);font-weight:600;font-size:1rem}
.rdv .h small{display:block;color:var(--muted);font-size:.74rem;font-family:var(--f-body);font-weight:400}
.rdv .grow{min-width:0;cursor:pointer}
.rdv.dim{opacity:.55}
.sel-pill{border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-size:.8rem;background:var(--surface);max-width:150px}

/* chat */
.groups .li{cursor:pointer}
.gicon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;flex:none;font-size:1.05rem;
  background:linear-gradient(145deg,var(--gold-1),var(--gold-2) 55%,var(--gold-3));color:#fff}
.chat-head{display:flex;align-items:center;gap:10px}
.msgs{display:flex;flex-direction:column;gap:8px;padding-block:10px}
.msg{max-width:min(80%,520px);display:flex;flex-direction:column;gap:3px;align-self:flex-start}
.msg.me{align-self:flex-end;align-items:flex-end}
.bub{background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 18px 6px;padding:9px 13px;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.me .bub{background:var(--bubble-me);color:var(--bubble-me-fg);border-color:transparent;border-radius:18px 18px 6px 18px}
.msg .meta{font-size:.74rem;color:var(--muted);display:flex;gap:8px;align-items:center}
.msg .meta button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:.74rem;padding:0;text-decoration:underline}
.m-img{border-radius:14px;max-height:300px;cursor:zoom-in;display:block}
.msg audio{max-width:260px;height:40px}
.daysep{align-self:center;font-size:.74rem;color:var(--muted);background:var(--surface-2);padding:3px 12px;border-radius:999px;margin-block:6px}
.composer{position:sticky;bottom:calc(var(--navh) + 12px + env(safe-area-inset-bottom,0px));background:var(--surface);padding:6px;border-radius:26px;display:flex;gap:4px;align-items:flex-end;border:1px solid var(--line);box-shadow:var(--shadow);z-index:3}
@media(min-width:960px){.composer{bottom:16px}}
.composer textarea{flex:1;min-height:42px;max-height:140px;resize:none;border:0;border-radius:20px;padding:10px 12px;background:transparent}
.composer textarea:focus{box-shadow:none}
.composer .send{background:var(--accent);color:var(--accent-fg);border-radius:50%}
.composer .send:hover{background:var(--accent);color:var(--accent-fg)}

/* checklists */
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tpl{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.tpl:hover{border-color:var(--gold-2)}
.tpl .gold{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.tpl .gold svg{width:20px;height:20px}
.tpl .n{font-weight:600;display:block;line-height:1.3}
.ck-sec{font-family:var(--f-display);font-weight:600;font-size:.95rem;padding:18px 2px 6px;color:var(--accent)}
.ck{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.ck input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin-top:1px}
.ck.done span{color:var(--muted);text-decoration:line-through}

/* stock */
.stk{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line)}
.stk:last-child{border-bottom:0}
.stk .grow{min-width:0;cursor:pointer}
.qty{display:flex;align-items:center;gap:4px}
.qty b{min-width:44px;text-align:center;font-family:var(--f-display);font-weight:600;font-size:1.02rem}
.qty .ib{width:34px;height:34px;border:1px solid var(--line);border-radius:10px}
.stk.low .qty b{color:var(--bad)}

/* dialogs */
dialog{border:0;padding:0;border-radius:22px;background:var(--surface);color:var(--fg);width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 40px);box-shadow:0 30px 80px -20px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(20,16,10,.5);backdrop-filter:blur(2px)}
.dlg-in{display:flex;flex-direction:column;max-height:calc(100dvh - 40px)}
.dlg-in header{display:flex;align-items:center;gap:8px;padding:16px 18px;border-bottom:1px solid var(--line)}
.dlg-in header h2{flex:1}
.dlg-b{padding:18px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.dlg-in footer{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.dlg-in footer .sp{flex:1}
.sheet-list{display:flex;flex-direction:column;gap:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--navh) + 26px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--panel);color:var(--panel-fg);padding:11px 18px;border-radius:14px;font-size:.92rem;max-width:calc(100vw - 32px);box-shadow:var(--shadow)}
.toast.err{background:var(--bad);color:#fff}
.article{padding-block:16px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:44px 1fr;gap:4px 12px}
.article:last-child{border-bottom:0}
.article .art-n{grid-row:span 2;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:.9rem}
.article h3{margin:0;align-self:center}
.article p{margin:0;white-space:pre-wrap;max-width:68ch;color:var(--muted)}
.searchbar{position:relative}
.searchbar svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted);pointer-events:none}
.searchbar .inp{padding-left:46px;font-size:16px;border-radius:16px;padding-block:14px;box-shadow:var(--shadow)}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:600;flex:none;text-transform:uppercase;font-size:.88rem}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.thumb{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#141210;padding:0;cursor:pointer;display:flex;flex-direction:column;text-align:left;min-width:0}
.thumb img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;max-width:100%}
.thumb .pdf{aspect-ratio:4/3;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;color:var(--accent);background:var(--accent-soft);width:100%}
.thumb .cap{padding:8px 10px;background:var(--surface);display:flex;flex-direction:column;font-size:.78rem;color:var(--muted);min-width:0}
.thumb .cap b{color:var(--fg);font-weight:600;font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:6px 0 0}
.dl dt{color:var(--muted);font-size:.86rem}
.dl dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.banner.danger{background:var(--bad-soft);color:var(--bad);font-weight:600;display:flex;gap:8px;align-items:center}
.banner.danger svg{width:18px;height:18px;flex:none}
fieldset.fs{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:14px;min-width:0}
.perms{border:1px solid var(--line);border-radius:14px;padding:4px 14px;margin:0}
.perms legend{font-size:.84rem;font-weight:600;color:var(--muted);padding:0 4px}
.perm{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.perm:last-child{border-bottom:0}
.perm input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.gate{max-width:520px;margin:5vh auto 0;text-align:center;align-items:center}
.gate img{width:76px;height:76px;filter:drop-shadow(0 0 14px var(--glow))}
.gate p{margin:0;max-width:44ch}
.previews{display:flex;gap:6px;flex-wrap:wrap}
.previews img{width:64px;height:64px;object-fit:cover;border-radius:10px}
.viewer img{width:100%;border-radius:12px;background:#141210}
.rdv-side{display:flex;gap:4px;align-items:center}
.li.wrap{flex-wrap:wrap}.li.wrap .grow{min-width:150px}.li .acts{display:flex;gap:8px;margin-left:auto}
.lab-head{display:flex;align-items:center;gap:14px}
.lab-mark{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;flex:none}
.lab-mark svg{width:26px;height:26px}
.lab-kpis{display:flex;gap:26px;flex-wrap:wrap;padding:14px 18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.segtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.segtabs::-webkit-scrollbar{display:none}
.segtab{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:9px 13px;cursor:pointer;font-weight:600;white-space:nowrap;flex:none;color:var(--muted)}
.segtab svg{width:18px;height:18px}
.segtab em{font-style:normal;font-size:.72rem;background:var(--accent-soft);color:var(--accent);border-radius:9px;padding:1px 7px}
.segtab em.bad{background:var(--bad-soft);color:var(--bad)}
.segtab[aria-selected="true"]{background:linear-gradient(145deg,var(--gold-1),var(--gold-2) 55%,var(--gold-3));color:#fff;border-color:transparent;box-shadow:0 0 16px var(--glow)}
.segtab[aria-selected="true"] em{background:rgba(255,255,255,.25);color:#fff}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.case{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);min-width:0}
.case.late{border-color:var(--bad)}
.case-top{display:flex;gap:10px;align-items:flex-start;cursor:pointer;min-width:0}
.case-top .grow{flex:1;min-width:0}
.case-top .t{font-weight:600}
.case-top .s{font-size:.84rem;color:var(--muted);overflow-wrap:anywhere}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--surface-2)}
.steps i.on{background:linear-gradient(90deg,var(--gold-1),var(--gold-2))}
.case-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.case-foot .sp{flex:1}
.case-foot .btn{padding:7px 11px;font-size:.86rem}
.case-foot .btn svg{width:16px;height:16px}
.recbar{position:sticky;bottom:calc(var(--navh) + 12px + env(safe-area-inset-bottom,0px));background:var(--surface);padding:8px 8px 8px 16px;border-radius:26px;display:flex;gap:8px;align-items:center;border:1px solid var(--line);box-shadow:var(--shadow);z-index:3}
@media(min-width:960px){.recbar{bottom:16px}}
.recbar .dot{width:10px;height:10px;border-radius:50%;background:var(--bad);animation:blink 1s infinite}
.recbar .sp{flex:1}
@keyframes blink{50%{opacity:.25}}
.auth-switch{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.auth-switch button{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:6px}
.install{display:flex;gap:14px;align-items:center}
.install img{width:48px;height:48px;border-radius:12px;flex:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

 },
 update(){
  if(!S.grp){const gl=$('#gList');if(!gl)return;gl.innerHTML=myGroups().map(g=>{const last=S.latest.find(m=>m.groupe===g.id);const n=unreadOf(g.id);
   return `<div class="li" data-act="openGroup" data-id="${esc(g.id)}"><div class="gicon">${esc(g.nom[0]||'G')}</div><div class="grow"><div class="t">${esc(g.nom)}</div><div class="s">${last?esc(nameOf(last.by)+' : '+(last.type==='image'?'Photo':last.type==='audio'?'Message vocal':(last.texte||'')).slice(0,80)):esc(g.desc||'')}</div></div>${n?`<span class="pill acc">${n}</span>`:last?`<span class="small muted num">${hm(last.ts)}</span>`:''}</div>`}).join('');return}

   const mine=m.by===S.uid;const src=m.asset?blobUrl(m.asset):(m.data||'');
   const body=m.type==='image'?`<img class="m-img" src="${esc(src)}" alt="Photo de ${esc(nameOf(m.by))}" data-act="zoom" loading="lazy">${m.texte?`<div class="bub">${esc(m.texte)}</div>`:''}`:m.type==='audio'?`<audio controls preload="metadata" src="${esc(src)}"></audio>`:`<div class="bub">${esc(m.texte)}</div>`;
   return sep+`<div class="msg ${mine?'me':''}">${body}<div class="meta">${mine?'':`<strong>${esc(nameOf(m.by))}</strong>`}<span class="num">${hm(m.ts)}</span>${(mine||S.isOwner)?`<button data-act="delMsg" data-id="${esc(m.id)}">supprimer</button>`:''}</div></div>`}).join(''):`<div class="empty"><strong>Aucun message</strong>Écrivez le premier message, ou envoyez une photo ou un vocal.</div>`;
  if(ms.length)markSeen(S.grp,ms[ms.length-1].ts);

function openGroup(id){if(!myGroups().some(g=>g.id===id)){toast('Ce groupe ne vous est pas accessible.','err');return}S.grp=id;S.grpMsgs=[];S.subs.grp?.();if(S.db){S.subs.grp=S.db.collection('messages').where('groupe','==',id).orderBy('ts','desc').limit(150).onSnapshot(s=>{S.grpMsgs=s.docs.map(d=>({id:d.id,...d.data()}));refresh('groupes')},e=>console.warn(e))}

async function postMsg(data){if(!S.grp)return false;return W(()=>S.db.collection('messages').add({groupe:S.grp,by:S.uid||'',ts:Date.now(),...data}))}
const fileToDataURL=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)});
async function compressImg(file,max,q){const url=URL.createObjectURL(file);try{const img=new Image();await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url});
 const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);
 c.getContext('2d').drawImage(img,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,'image/jpeg',q))}finally{URL.revokeObjectURL(url)}}
$('#imgfile').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f||!S.grp)return;toast('Envoi de la photo…');
 try{if(S.assets){const blob=await compressImg(f,1600,.82);const up=await S.assets.upload(blob,{type:'image/jpeg'});await postMsg({type:'image',asset:up.id})}
  else{const blob=await compressImg(f,900,.6);if(blob.size>200000){toast('Photo trop lourde pour cet affichage.','err');return}await postMsg({type:'image',data:await fileToDataURL(blob)})}
  toast('Photo envoyée')}catch(err){console.warn(err);toast(errMsg(err),'err')}});
$('#audfile').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f||!S.grp)return;
 toast('Envoi du message vocal…');try{const up=await S.assets.upload(f,{type:f.type||'audio/mp4'});await postMsg({type:'audio',asset:up.id});toast('Message vocal envoyé')}catch(err){console.warn(err);toast(errMsg(err),'err')}});
async function startRec(){if(!(navigator.mediaDevices?.getUserMedia&&window.MediaRecorder)){$('#audfile').click();return}
 let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){toast('Micro refusé : autorisez-le dans les réglages, ou choisissez un fichier audio.','err');$('#audfile').click();return}
 const mime=['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/aac'].find(t=>MediaRecorder.isTypeSupported?.(t))||'';
 const rec=new MediaRecorder(stream,mime?{mimeType:mime,audioBitsPerSecond:32000}:{audioBitsPerSecond:32000});const chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
 const comp=$('.composer');const bar=document.createElement('div');bar.className='recbar';
 bar.innerHTML=`<span class="dot"></span><span id="recT" class="num">0:00</span><span class="sp"></span><button class="btn ghost" type="button" id="recX">Annuler</button><button class="btn pri" type="button" id="recOk">${ic('send')}Envoyer</button>`;
 comp.hidden=true;comp.after(bar);const t0=Date.now();let send=false,done=false;
 const iv=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);const el=$('#recT');if(el)el.textContent=Math.floor(s/60)+':'+pad(s%60);if(s>=90)stop(true)},300);
 const stop=ok=>{if(done)return;done=true;send=ok;clearInterval(iv);try{rec.stop()}catch(e){}stream.getTracks().forEach(t=>t.stop());bar.remove();comp.hidden=false};
 rec.onstop=async()=>{if(!send)return;const type=(rec.mimeType||mime||'audio/webm').split(';')[0];const blob=new Blob(chunks,{type});if(blob.size<800){toast('Message trop court.','err');return}
  toast('Envoi du message vocal…');try{const up=await S.assets.upload(blob,{type});await postMsg({type:'audio',asset:up.id});toast('Message vocal envoyé')}catch(err){console.warn(err);toast(errMsg(err),'err')}};
 rec.start(250);$('#recX').onclick=()=>stop(false);$('#recOk').onclick=()=>stop(true)}

async function encryptFor(pubJwk,obj){const pub=await crypto.subtle.importKey('jwk',pubJwk,{name:'RSA-OAEP',hash:'SHA-256'},false,['encrypt']);
 const k=await crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt']);const iv=crypto.getRandomValues(new Uint8Array(12));
 const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(JSON.stringify(obj)));const raw=await crypto.subtle.exportKey('raw',k);
 const wk=await crypto.subtle.encrypt({name:'RSA-OAEP'},pub,raw);return {v:1,iv:b64(iv),ct:b64(ct),k:b64(wk)}}
async function privKey(){if(S.privKey)return S.privKey;const s=await S.db.doc(`data/users/${S.uid}/cles`).get();if(!s.exists)throw new Error('nokey');
 S.privKey=await crypto.subtle.importKey('jwk',s.data().priv,{name:'RSA-OAEP',hash:'SHA-256'},false,['decrypt']);return S.privKey}
async function decryptEnt(enc){const pk=await privKey();const raw=await crypto.subtle.decrypt({name:'RSA-OAEP'},pk,unb64(enc.k));
 const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(enc.iv)},k,unb64(enc.ct));return JSON.parse(new TextDecoder().decode(pt))}

 try{const kp=await crypto.subtle.generateKey({name:'RSA-OAEP',modulusLength:2048,publicExponent:new Uint8Array([1,0,1]),hash:'SHA-256'},true,['encrypt','decrypt']);
  const pub=await crypto.subtle.exportKey('jwk',kp.publicKey),priv=await crypto.subtle.exportKey('jwk',kp.privateKey);

  await W(()=>S.db.doc('cfg/caisse').set({pub,active:Date.now()}),'Caisse activée')}catch(e){console.warn(e);toast('Activation impossible sur cet appareil.','err')}}

 try{const s=await S.db.collection(k).where(conf[0],'<',cutoff).limit(300).get();for(const d of s.docs){const x=d.data();if(x.asset&&S.assets){try{await S.assets.delete(x.asset)}catch(e){}}await S.db.doc(k+'/'+d.id).delete();n++}

 labNext:a=>{const c=S.labo.find(x=>x.id===a.dataset.id);if(!c)return;const nx=LAB[c.section].steps[labStepIdx(c)+1];if(nx)labSetStep(c,nx[0])},
 labAddPhoto:a=>{if(!S.assets){toast('L\'ajout de photos demande un accès Éditeur à la page.','err');return}S.labUpId=a.dataset.id;$('#labfile').click()},
 labZoom:async a=>{const src=await blobReady(a.dataset.a);const w=window.open?null:null;const d=$('#ask');d.innerHTML=`<div class="dlg-in"><div class="dlg-b"><img src="${esc(src)}" alt="Photo du travail" style="width:100%;border-radius:12px"></div><footer><span class="sp"></span><button class="btn pri" id="askn">Fermer</button></footer></div>`;$('#askn').onclick=()=>d.close();d.onclose=null;d.showModal()},
 labShare:a=>labShare(a.dataset.id),memRefuse:async a=>{const u=a.dataset.u;if(await ask('Refuser l\'accès de '+nameOf(u)+' ?','Refuser'))setMember(u,{statut:'refuse',le:Date.now()},'Demande refusée')},
 openPat:a=>openPatient(a.dataset.id),closePat:()=>{closePatient();go('patients')},patNew:()=>patModal(),patEdit:()=>patModal(S.patDoc),
 patRdv:()=>{const p=S.patDoc;rdvModal({date:today(),heure:'',duree:30,statut:'prevu',patient:patName(p),patientId:p.id,tel:p.tel||''})},
 patLab:()=>{const p=S.patDoc;openModal({title:'Travail de laboratoire',ok:null,cancel:'Annuler',body:`<div class="sheet-list">${Object.entries(LAB).map(([k,v])=>`<button type="button" class="nav-item" data-act="patLabPick" data-t="${k}">${ic(v.ic)}<span>${esc(v.nom)}</span></button>`).join('')}</div>`})},
 patLabPick:a=>{$('#dlg').close();const p=S.patDoc;S.labTab=a.dataset.t;labModal({section:a.dataset.t,statut:LAB[a.dataset.t].steps[0][0],patient:patName(p),patientId:p.id,envoiLe:a.dataset.t==='externe'?today():''})},
 patRdvOpen:a=>{const r=S.patRdv.find(x=>x.id===a.dataset.id);if(r)rdvModal(r)},
 rdvToPat:a=>{$('#dlg').close();openPatient(a.dataset.id)},
 patFilter:a=>{S.patFilter=a.dataset.k;updatePatient()},patView:a=>patView(a.dataset.id),
 patUpload:a=>{if(!S.assets){toast('L\'ajout de fichiers demande un accès Éditeur à la page.','err');return}S.upType=a.dataset.t;const i=$('#patfile');i.accept=a.dataset.t==='document'?'image/*,application/pdf':'image/*';i.multiple=a.dataset.t!=='radio';i.click()},purge:a=>purge(a.dataset.k)
};

/* ---------- boot ---------- */
function resolveProfiles(){const p={};members().forEach(u=>{const n=S.annuaire[u]?.nom||'';p[u]={name:n,avatarUrl:avatarFor(n||S.annuaire[u]?.email||'?')}});S.prof=p;refresh();renderMe()}
function renderMe(){const c=$('#mechip');if(!S.me){c.innerHTML='';return}const r=myRole();
 c.innerHTML=`<img src="${esc(S.me.avatarUrl)}" alt=""><span>${esc(nameOf(S.uid))}${S.isOwner?', administrateur':r?', '+esc(ROLES[r]):''}</span>`}
const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
let deferredPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;refresh('accueil')});
window.addEventListener('appinstalled',()=>{deferredPrompt=null;ls.set('ns_install_hide',1);refresh('accueil')});
function installCard(){if(isStandalone()||ls.get('ns_install_hide',0))return '';const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
 if(!deferredPrompt&&!ios)return '';
 return `<section class="card install"><img src="apple-touch-icon.png" alt=""><div class="grow" style="flex:1;min-width:0"><h3>Installer l'application</h3><div class="small muted">${ios?'Dans Safari, touchez le bouton Partager puis « Sur l\'écran d\'accueil ».':'Ajoutez Natural Smile à votre écran d\'accueil pour l\'ouvrir comme une application.'}</div></div>${deferredPrompt?'<button class="btn pri" data-act="installApp">Installer</button>':''}<button class="ib" data-act="installHide" aria-label="Masquer">${ic('x')}</button></section>`}
async function installApp(){if(!deferredPrompt)return;deferredPrompt.prompt();try{await deferredPrompt.userChoice}catch(e){}deferredPrompt=null;refresh('accueil')}
Acts.installHide=()=>{ls.set('ns_install_hide',1);refresh('accueil')};
function addSub(fn){S.dataSubs.push(fn)}
function stopData(){(S.dataSubs||[]).forEach(f=>{try{f()}catch(e){}});S.dataSubs=[];S.subs.rdvSel?.();S.subs.rdvSel=null;S.dataStarted=false}
function startData(){if(S.dataStarted||gated())return;S.dataStarted=true;const db=S.db;const w=e=>console.warn(e);
 if(perm('rdv_voir')){addSub(db.collection('rdv').where('date','==',today()).onSnapshot(s=>{S.rdvToday=s.docs.map(d=>({id:d.id,...d.data()}));refresh('accueil')},w));subRdvSel()}
 if(perm('mod_groupes')){const acc={};myGroups().forEach(g=>addSub(db.collection('messages').where('groupe','==',g.id).orderBy('ts','desc').limit(20).onSnapshot(s=>{acc[g.id]=s.docs.map(d=>({id:d.id,...d.data()}));S.latest=Object.values(acc).flat().sort((a,b)=>b.ts-a.ts);refresh('accueil','groupes')},w)))}
 if(perm('mod_stock')||perm('labo_voir'))addSub(db.collection('stock').onSnapshot(s=>{S.stock=s.docs.map(d=>({id:d.id,...d.data()}));refresh('stock','accueil','labo')},w));
 if(perm('labo_voir'))addSub(db.collection('labo').orderBy('maj','desc').limit(500).onSnapshot(s=>{S.labo=s.docs.map(d=>({id:d.id,...d.data()}));refresh('labo','accueil','patients');const P=$('#labPhotos');if(P){const c=S.labo.find(x=>x.id===P.dataset.id);if(c)P.innerHTML=labPhotosHTML(c)}},w));
 if(perm('mod_checklists'))addSub(db.collection('executions').where('date','==',today()).onSnapshot(s=>{S.execToday=s.docs.map(d=>({id:d.id,...d.data()}));refresh('checklists','accueil')},w));
 if(perm('mod_pointage'))addSub(db.doc(`pointage/${S.uid}/j/${today()}`).onSnapshot(s=>{S.myPointage=s.exists?s.data():null;refresh('accueil','pointage')},w));
 if(perm('caisse'))addSub(db.collection(`recettes/${S.uid}/e`).where('date','==',today()).onSnapshot(s=>{S.myRecCount=s.size;refresh('caisse')},w));
 refresh()}
function restartData(){stopData();S.rdvToday=[];S.latest=[];S.stock=[];S.labo=[];S.execToday=[];startData()}
let membresAllSub=null;
function watchMembers(){if(membresAllSub)return;membresAllSub=S.db.collection('membres').onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());S.membres=m;S.membreLoaded=true;afterMembers()},e=>console.warn(e))}
let lastMine='';
function afterMembers(){const mine=JSON.stringify(S.membres[S.uid]||null);const changed=mine!==lastMine;lastMine=mine;renderMe();
 if(!S.isOwner&&statutOf(S.uid)==='actif')watchMembers();
 if(gated()){if(S.dataStarted)stopData()}else if(!S.dataStarted)startData();else if(changed&&!S.isOwner)restartData();
 if(S.view==='attente'||gated()||!allowedView(S.view))reroute();else refresh()}
async function boot(){
 S.dataSubs=[];S.membres={};
 const h=(location.hash||'').slice(1);if(Views[h])S.view=h;go('attente');
 const cfg=window.NS_CONFIG?.firebase;
 if(!window.firebase||!cfg||!cfg.apiKey||/COLLEZ|VOTRE/i.test(cfg.apiKey)){S.ready=true;S.db=null;go('attente');return}
 firebase.initializeApp(cfg);
 const db=firebase.firestore();try{db.settings({ignoreUndefinedProperties:true,merge:true})}catch(e){}
 try{await db.enablePersistence({synchronizeTabs:true})}catch(e){}
 S.db=db;
 const MAXB=700000;
 const toDataURL=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)});
 S.assets={async upload(blob,o){let type=(o&&o.type)||blob.type||'application/octet-stream';
   if(type.startsWith('image/')&&blob.size>MAXB){for(const [m,q] of [[1600,.78],[1300,.72],[1000,.65]]){blob=await compressImg(blob,m,q);type='image/jpeg';if(blob.size<=MAXB)break}}
   if(blob.size>MAXB){const e=new Error('too_large');e.code='too_large';throw e}
   const data=await toDataURL(new Blob([blob],{type}));const ref=db.collection('fichiers').doc();
   await ref.set({data,type,taille:blob.size,by:S.uid,ts:Date.now()});FS.cache.set(ref.id,data);return {id:'fs:'+ref.id,url:data}},
  async delete(id){id=String(id||'');if(id.startsWith('fs:'))await db.doc('fichiers/'+id.slice(3)).delete()}};
 window.addEventListener('online',()=>{S.offline=false;refresh()});window.addEventListener('offline',()=>{S.offline=true;refresh()});S.offline=!navigator.onLine;
 firebase.auth().onAuthStateChanged(async u=>{
  if(!u){if(S.authUser){location.reload();return}S.authUser=null;S.ready=true;go('attente');return}
  S.authUser=u;S.uid=u.uid;const email=(u.email||'').toLowerCase();const adminEmail=ADMINS.includes(email);
  S.isOwner=adminEmail&&u.emailVerified;S.adminUnverified=adminEmail&&!u.emailVerified;
  S.me={id:u.uid,name:u.displayName||'',email:u.email||'',avatarUrl:avatarFor(u.displayName||u.email),isOwner:S.isOwner};
  S.ready=true;renderMe();
  if(S.adminUnverified){go('attente');return}
  if(S.pendingSignup){const p=S.pendingSignup;S.pendingSignup=null;try{await db.doc('annuaire/'+u.uid).set({nom:p.nom,email:p.email,roleSouhaite:p.role,demandeLe:Date.now(),premiere:Date.now(),derniere:today()})}catch(e){console.warn(e)}}
  db.collection('cfg').onSnapshot(s=>{const c={};s.docs.forEach(d=>c[d.id]=d.data());const oldG=JSON.stringify(myGroups().map(g=>g.id));S.cfg=c;S.cfgLoaded=true;renderMe();
   if(S.dataStarted&&JSON.stringify(myGroups().map(g=>g.id))!==oldG)restartData();
   if(S.view==='attente'||gated()||!allowedView(S.view)){reroute()}else if(S.view==='caisse'&&(S.caisseTab||'saisie')==='saisie'&&!!c.caisse?.pub!==!!$('#caForm')&&!document.activeElement?.closest?.('#caForm')){go('caisse')}else refresh();if(!gated()&&!S.dataStarted)startData()},e=>{console.warn(e);S.cfgLoaded=true;reroute()});
  db.collection('annuaire').onSnapshot(s=>{const a={};s.docs.forEach(d=>a[d.id]=d.data());S.annuaire=a;S.annuaireLoaded=true;resolveProfiles();if(S.view==='attente'||gated())reroute()},e=>{console.warn(e);S.annuaireLoaded=true;reroute()});
  if(S.isOwner){watchMembers()}
  else db.doc('membres/'+u.uid).onSnapshot(s=>{if(s.exists)S.membres[u.uid]=s.data();else delete S.membres[u.uid];S.membreLoaded=true;afterMembers()},e=>{console.warn(e);S.membreLoaded=true;afterMembers()});
  try{const ref=db.doc('annuaire/'+u.uid);const s=await ref.get();
   if(!s.exists){if(S.isOwner)await ref.set({nom:u.displayName||'Dr Saadeddine Hafdi Idrissi',email:u.email,premiere:Date.now(),derniere:today(),proprietaire:true})}
   else if(s.data().derniere!==today())await ref.update({derniere:today()})}catch(e){console.warn(e)}
  if(S.isOwner){S.membreLoaded=true;startData();go(S.view==='attente'?'accueil':S.view)}
 });
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(e=>console.warn(e));
 setInterval(()=>{if(['accueil','pointage'].includes(S.view)&&!document.querySelector('dialog[open]'))refresh(S.view)},30000);
}
boot();
</script>
